<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Desk Terrarium — a cozy pixel sandbox</title>
    <meta name="robots" content="noindex" />
    <!--
      Click-to-load shell for embedding the sandbox in a page on another site.

      The point is weight. The app is ~9 MB with its ambience beds, and an embed that
      autoloads makes every visitor who scrolls past pay for it. This poster is a few KB
      and pulls in nothing until someone actually asks to play.

      Everything on it — falling rain, condensation beaded on the glass, and the distant
      lightning bloom — is tiling CSS gradients rather than images or canvas, so the whole
      card stays a few KB and costs nothing to fetch. Each layer is a repeating strip of
      dashes translated by exactly one tile height, which loops seamlessly, and the only
      animated property is `transform` so it composites on the GPU without repainting.

      Every path here is relative, so this file works unchanged at a domain root or under
      a subpath — it always sits next to the index.html it launches, whatever COZY_BASE
      was set to at build time.

      Host this on the SAME ORIGIN as the page embedding it. Served cross-origin (from
      itch.io, say) the sandbox becomes a third-party frame, and Safari blocks its
      localStorage outright while Chrome partitions it — which silently breaks saving a
      terrarium, the one thing players want to keep.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #091018;
        color: #e8ecf2;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
        background: radial-gradient(120% 90% at 50% 12%, #1b2534 0%, #0d1421 55%, #070c13 100%);
      }

      /* Two rain layers at different size, speed, and opacity read as depth: the near
         sheet is longer, brighter, and faster, the far one finer and slower. Both are
         oversized and rotated so the slanted streaks still cover the corners. */
      .rain {
        position: absolute;
        inset: -40%;
        pointer-events: none;
        background-repeat: repeat;
        will-change: transform;
      }
      /* Each drop is an elongated ellipse. A one-dimensional linear-gradient cannot leave
         gaps along both axes — its band spans the whole tile width, so neighbouring tiles
         merge into continuous stripes and it reads as venetian blinds. Elliptical radial
         gradients give a real streak with space around it on every side. */
      .rain--far {
        background-image:
          radial-gradient(1px 9px at 18% 14%, rgba(158, 188, 220, 0.30), transparent 62%),
          radial-gradient(1px 7px at 63% 57%, rgba(158, 188, 220, 0.22), transparent 62%);
        background-size: 52px 90px;
        animation: rain-far 1.5s linear infinite;
      }
      .rain--near {
        background-image:
          radial-gradient(1.3px 15px at 32% 22%, rgba(200, 224, 250, 0.40), transparent 60%),
          radial-gradient(1.1px 12px at 77% 66%, rgba(200, 224, 250, 0.30), transparent 60%);
        background-size: 76px 132px;
        animation: rain-near 0.9s linear infinite;
      }
      /* Translating by exactly one tile height puts the pattern back where it started,
         so the loop has no visible seam. The rotate has to be repeated in both keyframes
         or the animation would override it. */
      @keyframes rain-far {
        from { transform: rotate(11deg) translateY(-90px); }
        to   { transform: rotate(11deg) translateY(0); }
      }
      @keyframes rain-near {
        from { transform: rotate(11deg) translateY(-132px); }
        to   { transform: rotate(11deg) translateY(0); }
      }

      /* Condensation clinging to the inside of the glass, in front of the falling rain so
         the two read as different distances: weather outside, window between. Each bead is
         a bright core fading to a faint rim, which is enough to look lens-like at this size.
         Beads do not move — they cling — so this layer is static and costs nothing to run. */
      .glass {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .glass--a {
        background-image:
          radial-gradient(circle 3px at 12% 18%, rgba(228, 241, 255, 0.40), rgba(140, 170, 200, 0.10) 62%, transparent 74%),
          radial-gradient(circle 5px at 63% 34%, rgba(228, 241, 255, 0.34), rgba(140, 170, 200, 0.10) 62%, transparent 74%),
          radial-gradient(circle 2px at 84% 11%, rgba(228, 241, 255, 0.38), transparent 72%),
          radial-gradient(circle 4px at 37% 71%, rgba(228, 241, 255, 0.32), rgba(140, 170, 200, 0.09) 62%, transparent 74%),
          radial-gradient(circle 2px at 78% 84%, rgba(228, 241, 255, 0.32), transparent 72%),
          radial-gradient(circle 3px at 20% 92%, rgba(228, 241, 255, 0.28), transparent 74%);
        background-size: 184px 202px;
      }
      .glass--b {
        background-image:
          radial-gradient(circle 2px at 45% 8%, rgba(228, 241, 255, 0.30), transparent 72%),
          radial-gradient(circle 4px at 88% 48%, rgba(228, 241, 255, 0.30), rgba(140, 170, 200, 0.08) 62%, transparent 74%),
          radial-gradient(circle 2px at 8% 62%, rgba(228, 241, 255, 0.26), transparent 72%),
          radial-gradient(circle 3px at 58% 88%, rgba(228, 241, 255, 0.26), transparent 74%);
        background-size: 137px 151px;
        background-position: 40px 25px;
      }

      /* Distant lightning: a soft bloom with no bolts, a couple of flickers every eleven
         seconds. Deliberately restrained — this game's whole promise is that nothing is
         chasing you, and a dramatic storm would argue with that. */
      .flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(130% 85% at 50% -10%, rgba(186, 208, 255, 0.55), transparent 62%);
        animation: storm 11s ease-out infinite;
      }
      @keyframes storm {
        0%, 90%, 100% { opacity: 0; }
        91%           { opacity: 0.5; }
        92.5%         { opacity: 0.08; }
        94%           { opacity: 0.38; }
        97%           { opacity: 0; }
      }

      /* Warm lamplight pooling at the bottom — the reason it reads as cosy rain seen from
         indoors rather than as weather. */
      .lamp {
        position: absolute;
        inset: auto 0 -12% 0;
        height: 62%;
        pointer-events: none;
        background: radial-gradient(58% 100% at 50% 100%, rgba(244, 223, 184, 0.11), transparent 72%);
      }
      /* Keeps the rain from crawling over the type. */
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(46% 40% at 50% 48%, rgba(7, 12, 19, 0.72), transparent 75%);
      }

      .content {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: clamp(1.25rem, 5vw, 3rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font: 600 clamp(1.35rem, 3.4vw, 2rem)/1.2 Georgia, "Iowan Old Style", serif;
        color: #f4dfb8;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 18px rgba(7, 12, 19, 0.9);
      }
      p {
        margin: 0;
        max-width: 46ch;
        color: #a8bccd;
        font-size: clamp(0.9rem, 1.6vw, 1rem);
        text-shadow: 0 1px 12px rgba(7, 12, 19, 0.85);
      }
      .play {
        margin-top: 0.4rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid rgba(244, 223, 184, 0.42);
        border-radius: 999px;
        background: rgba(244, 223, 184, 0.1);
        color: #f4dfb8;
        font: 600 1rem/1 inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        backdrop-filter: blur(2px);
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }
      .poster:hover .play,
      .play:focus-visible {
        background: rgba(244, 223, 184, 0.19);
        border-color: rgba(244, 223, 184, 0.75);
        transform: translateY(-1px);
      }
      .play:focus-visible { outline: 2px solid #f4dfb8; outline-offset: 3px; }
      .hint { font-size: 0.78rem; color: #7b91a4; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }

      /* Motion is decoration here, so drop it entirely when it is unwelcome — the rain
         stays as a still texture rather than disappearing. */
      @media (prefers-reduced-motion: reduce) {
        .rain { animation: none; transform: rotate(11deg); }
        /* The beads are static anyway; the storm is pure motion, so it goes entirely. */
        .flash { animation: none; opacity: 0; }
        .play { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="poster" id="poster">
      <span class="flash" aria-hidden="true"></span>
      <span class="rain rain--far" aria-hidden="true"></span>
      <span class="rain rain--near" aria-hidden="true"></span>
      <span class="glass glass--a" aria-hidden="true"></span>
      <span class="glass glass--b" aria-hidden="true"></span>
      <span class="lamp" aria-hidden="true"></span>
      <span class="scrim" aria-hidden="true"></span>
      <div class="content">
        <h1>Night Desk Terrarium</h1>
        <p>
          A cozy pixel sandbox. Pour sand and water, light a hearth, grow moss and
          moonlit flowers — no score, no timer, nothing to win.
        </p>
        <button class="play" id="play" type="button">Enter the terrarium</button>
        <span class="hint">Loads on click · sound is off until you turn it on</span>
      </div>
    </div>

    <script>
      // Swap the poster for the real app only once the visitor asks for it. Same-origin,
      // so the sandbox keeps normal access to localStorage and can save scenes.
      // The whole card is clickable for convenience, while the real <button> inside it is
      // the keyboard and screen-reader target.
      document.getElementById("poster").addEventListener(
        "click",
        () => {
          const frame = document.createElement("iframe");
          frame.src = "index.html";
          frame.title = "Night Desk Terrarium";
          frame.allow = "autoplay; fullscreen";
          document.body.replaceChildren(frame);
          frame.focus();
        },
        { once: true }
      );
    </script>
  </body>
</html>
