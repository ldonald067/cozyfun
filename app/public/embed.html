<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Desk Terrarium — a cozy pixel sandbox</title>
    <meta name="robots" content="noindex" />
    <!-- RELATIVE, unlike index.html: this file is copied verbatim out of public/, so
         Vite never rewrites it and a leading slash would break every subpath deploy. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" sizes="32x32" />
    <!--
      Click-to-load shell for embedding the sandbox in a page on another site.

      The point is weight. The app is ~7 MB with its ambience beds, and an embed that
      autoloads makes every visitor who scrolls past pay for it. This poster is ~19 KB
      and pulls in nothing until someone actually asks to play.

      Nothing here is an image. Rain and condensation are tiling CSS gradients; the
      lightning is inline SVG, generated once as a fractal and referenced three times. The
      card fetches no sub-resources at all, against roughly 440 KB of PNGs for the CodePen
      this borrows from.

      Two things were deliberately not borrowed. That reference animates
      `background-position`, which repaints every frame instead of compositing, and its
      travel is not a whole number of tiles, so the field visibly resets each cycle. Both
      are avoided here by translating whole tiles with `transform` (see the note above
      the rain keyframes).

      Every path here is relative, so this file works unchanged at a domain root or under
      a subpath — it always sits next to the index.html it launches, whatever COZY_BASE
      was set to at build time.

      Host this on the same SITE as the page embedding it — same registrable domain, which
      a subdomain satisfies. That is the boundary browsers actually enforce: Chrome
      partitions storage by top-level site and Safari's ITP judges third-party by
      registrable domain, so pixelfun.littlealbumclub.net inside littlealbumclub.net is not
      a third party even though it is a different origin. A wholly different domain
      (itch.io, say) is, and there the sandbox loses localStorage — silently breaking saved
      terrariums, the one thing players want to keep.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #091018;
        color: #e8ecf2;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
        background: radial-gradient(120% 90% at 50% 12%, #1b2534 0%, #0d1421 55%, #070c13 100%);
      }

      /* Three sheets at different drop size, speed and opacity read as depth: the near one
         largest, brightest and fastest, the far one finest and slowest. The slant comes
         from the drift keyframe below, not from a rotation, so these sit flush in the frame. */
      .rain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-repeat: repeat;
        will-change: transform;
      }
      /* Drops are small ovals, 1-3px, not streaks. Compositing the reference's rain PNG
         over a dark field shows its texture is speckle too — what turns those dots into
         rain is speed, not shape: they move fast enough to smear in the eye. Drawing the
         blur instead, as long thin streaks, looked like scratches; drawing large slow
         drops looked like snow.

         Each drop is a radial gradient because a one-dimensional linear-gradient cannot
         leave gaps along both axes — its band spans the whole tile width, so neighbouring
         tiles merge into unbroken stripes and the card reads as venetian blinds. */
      .rain--far {
        background-image:
          radial-gradient(1.2px 1.8px at 22% 12%, rgba(176, 202, 232, 0.42), transparent 70%),
          radial-gradient(1px 1.5px at 68% 44%, rgba(176, 202, 232, 0.36), transparent 70%),
          radial-gradient(1.2px 1.8px at 44% 78%, rgba(176, 202, 232, 0.38), transparent 70%),
          radial-gradient(1px 1.4px at 84% 88%, rgba(176, 202, 232, 0.32), transparent 70%);
        background-size: 51px 96px;
        animation: rain-far 0.34s linear infinite;
      }
      .rain--mid {
        background-image:
          radial-gradient(1.6px 2.4px at 16% 20%, rgba(198, 222, 248, 0.50), transparent 70%),
          radial-gradient(1.4px 2px at 58% 58%, rgba(198, 222, 248, 0.42), transparent 70%),
          radial-gradient(1.5px 2.2px at 86% 34%, rgba(198, 222, 248, 0.44), transparent 70%),
          radial-gradient(1.2px 1.8px at 36% 86%, rgba(198, 222, 248, 0.38), transparent 70%);
        background-size: 66px 124px;
        animation: rain-mid 0.26s linear infinite;
      }
      .rain--near {
        background-image:
          radial-gradient(2.2px 3.2px at 30% 24%, rgba(224, 239, 255, 0.58), transparent 68%),
          radial-gradient(1.9px 2.8px at 74% 62%, rgba(224, 239, 255, 0.50), transparent 68%),
          radial-gradient(1.7px 2.4px at 52% 88%, rgba(224, 239, 255, 0.44), transparent 68%);
        background-size: 85px 158px;
        animation: rain-near 0.2s linear infinite;
      }

      /* Each layer slides exactly one tile across and two down per cycle, so the pattern
         lands back on itself and the loop has no seam. The reference animates
         background-position from 0% 0% to 20% 100% instead, which is where the slant idea
         came from — but a percentage background-position resolves to
         (container - tile) * percentage, so its travel is almost never a whole number of
         tiles. Measured in this frame that snapped the near field 146px, roughly a whole
         tile, three times a second. Whole-tile transforms also make the motion independent
         of frame size, and animate a compositor property instead of forcing a repaint.
         Ratios are chosen so all three fall at about 15 degrees. */
      @keyframes rain-far  { to { transform: translate(51px, 192px); } }
      @keyframes rain-mid  { to { transform: translate(66px, 248px); } }
      @keyframes rain-near { to { transform: translate(85px, 316px); } }

      /* Condensation clinging to the inside of the glass, in front of the falling rain so
         the two read as different distances: weather outside, window between. Each bead is
         a bright core fading to a faint rim, which is enough to look lens-like at this size.
         Beads do not move — they cling — so this layer is static and costs nothing to run. */
      .glass {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .glass--a {
        background-image:
          radial-gradient(circle 3px at 12% 18%, rgba(228, 241, 255, 0.40), rgba(140, 170, 200, 0.10) 62%, transparent 74%),
          radial-gradient(circle 5px at 63% 34%, rgba(228, 241, 255, 0.34), rgba(140, 170, 200, 0.10) 62%, transparent 74%),
          radial-gradient(circle 2px at 84% 11%, rgba(228, 241, 255, 0.38), transparent 72%),
          radial-gradient(circle 4px at 37% 71%, rgba(228, 241, 255, 0.32), rgba(140, 170, 200, 0.09) 62%, transparent 74%),
          radial-gradient(circle 2px at 78% 84%, rgba(228, 241, 255, 0.32), transparent 72%),
          radial-gradient(circle 3px at 20% 92%, rgba(228, 241, 255, 0.28), transparent 74%);
        background-size: 184px 202px;
      }
      .glass--b {
        background-image:
          radial-gradient(circle 2px at 45% 8%, rgba(228, 241, 255, 0.30), transparent 72%),
          radial-gradient(circle 4px at 88% 48%, rgba(228, 241, 255, 0.30), rgba(140, 170, 200, 0.08) 62%, transparent 74%),
          radial-gradient(circle 2px at 8% 62%, rgba(228, 241, 255, 0.26), transparent 72%),
          radial-gradient(circle 3px at 58% 88%, rgba(228, 241, 255, 0.26), transparent 74%);
        background-size: 137px 151px;
        background-position: 40px 25px;
      }

      /* A gradient cannot make a fork, so the bolt is SVG. Its 44 branches were generated
         by a seeded fractal walk rather than drawn by hand — the reference bolt is dozens
         of hairlines forking recursively, which is not something to author by hand. The
         geometry is defined once and referenced by all three placements and all three
         stroke passes; writing it out per pass would have cost 59 KB instead of 3. */
      .bolt {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        overflow: visible;
        /* Violet bloom outside, blue nearer in — the halo does the colour work that a
           stroke this thin cannot. */
        filter: drop-shadow(0 0 9px rgba(150, 112, 246, 0.5)) drop-shadow(0 0 3px rgba(150, 190, 255, 0.8));
      }
      /* One bolt, placed three times at different scales and angles — the reference does
         exactly this with three copies of a single image, and it is why the markup stays
         small: the 44 branches are written once and referenced. */
      .bolt--1 { top: -6%; left: 4%;  height: clamp(150px, 62%, 380px); transform: rotate(-4deg); animation: strike 13s ease-out infinite; }
      .bolt--2 { top: -10%; left: 34%; height: clamp(110px, 46%, 280px); transform: rotate(9deg) scaleX(-1); animation: strike 13s ease-out 4.2s infinite; }
      .bolt--3 { top: -4%; right: 2%; height: clamp(130px, 54%, 330px); transform: rotate(6deg); animation: strike 13s ease-out 8.6s infinite; }
      /* Hairlines. The reference's branches are barely a pixel wide and read as light
         rather than as drawn lines, so the channel is thin and the colour comes from the
         two wider passes underneath it and the halo around it. */
      .bolt .halo    { stroke: rgba(158, 116, 250, 0.34); stroke-width: 3.4; }
      .bolt .glow    { stroke: rgba(132, 178, 255, 0.52); stroke-width: 1.5; }
      .bolt .channel { stroke: rgba(246, 249, 255, 0.94); stroke-width: 0.6; }
      .bolt use { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* A real strike is over in a blink and usually flickers twice. Most of the 13s cycle
         is dark, so it stays weather rather than a strobe. */
      @keyframes strike {
        0%, 5.5%, 100% { opacity: 0; }
        0.6%           { opacity: 1; }
        1.6%           { opacity: 0.12; }
        2.8%           { opacity: 0.8; }
        4.4%           { opacity: 0; }
      }

      /* The sky lifting behind the bolt — what actually sells it as distance. */
      .flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(130% 85% at 50% -10%, rgba(196, 206, 255, 0.5), rgba(142, 112, 220, 0.22) 34%, transparent 64%);
        animation: storm 13s ease-out infinite;
      }
      /* One flash per bolt, sharing each bolt's delay. A single un-staggered flash lit only
         the first strike and left the other two firing into an unlit sky. */
      .flash--2 { animation-delay: 4.2s; }
      .flash--3 { animation-delay: 8.6s; }
      @keyframes storm {
        0%, 5.5%, 100% { opacity: 0; }
        0.7%           { opacity: 0.55; }
        1.8%           { opacity: 0.08; }
        3%             { opacity: 0.4; }
        4.6%           { opacity: 0; }
      }

      /* Warm lamplight pooling at the bottom — the reason it reads as cosy rain seen from
         indoors rather than as weather. */
      .lamp {
        position: absolute;
        inset: auto 0 -12% 0;
        height: 62%;
        pointer-events: none;
        background: radial-gradient(58% 100% at 50% 100%, rgba(244, 223, 184, 0.11), transparent 72%);
      }
      /* Keeps the rain from crawling over the type. */
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(46% 40% at 50% 48%, rgba(7, 12, 19, 0.72), transparent 75%);
      }

      .content {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: clamp(1.25rem, 5vw, 3rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font: 600 clamp(1.35rem, 3.4vw, 2rem)/1.2 Georgia, "Iowan Old Style", serif;
        color: #f4dfb8;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 18px rgba(7, 12, 19, 0.9);
      }
      p {
        margin: 0;
        max-width: 46ch;
        color: #a8bccd;
        font-size: clamp(0.9rem, 1.6vw, 1rem);
        text-shadow: 0 1px 12px rgba(7, 12, 19, 0.85);
      }
      .play {
        margin-top: 0.4rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid rgba(244, 223, 184, 0.42);
        border-radius: 999px;
        background: rgba(244, 223, 184, 0.1);
        color: #f4dfb8;
        font: 600 1rem/1 inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        backdrop-filter: blur(2px);
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }
      .poster:hover .play,
      .play:focus-visible {
        background: rgba(244, 223, 184, 0.19);
        border-color: rgba(244, 223, 184, 0.75);
        transform: translateY(-1px);
      }
      .play:focus-visible { outline: 2px solid #f4dfb8; outline-offset: 3px; }
      .hint { font-size: 0.78rem; color: #7b91a4; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }

      /* Motion is decoration here, so drop it entirely when it is unwelcome — the rain
         stays as a still texture rather than disappearing. */
      @media (prefers-reduced-motion: reduce) {
        .rain { animation: none; }
        /* The beads are static anyway; the storm is pure motion, so it goes entirely. */
        .flash, .bolt { animation: none; opacity: 0; }
        .play { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="poster" id="poster">
      <span class="flash" aria-hidden="true"></span>
      <span class="flash flash--2" aria-hidden="true"></span>
      <span class="flash flash--3" aria-hidden="true"></span>
      <svg class="bolt bolt--1" viewBox="0 0 200 400" aria-hidden="true"><defs><g id="lb"><path d="M110 55 L109 63 L107 72 L102 79 L100 87"/><path d="M121 100 L115 104 L111 110 L106 116 L102 122"/><path d="M101 41 L110 55 L116 69 L120 84 L121 100 L120 115"/><path d="M83 139 L91 152 L97 166 L100 181 L100 196"/><path d="M69 163 L57 172 L48 184 L39 196 L32 210"/><path d="M97 14 L101 27 L101 41 L99 55 L97 69 L93 83 L92 97 L90 111 L87 125 L83 139 L77 151 L69 163"/><path d="M99 94 L96 98 L92 101 L88 103 L85 107"/><path d="M88 121 L87 125 L86 130 L86 135 L85 140"/><path d="M104 80 L99 94 L95 108 L88 121 L80 133"/><path d="M162 212 L165 215 L169 217 L172 220 L175 223"/><path d="M148 190 L157 200 L162 212 L167 224 L176 235"/><path d="M152 204 L164 213 L176 224 L186 236 L197 247"/><path d="M94 69 L104 80 L112 93 L118 106 L123 120 L126 135 L132 149 L137 162 L142 176 L148 190 L152 204"/><path d="M95 109 L100 121 L107 132 L116 141 L125 151"/><path d="M87 120 L76 128 L65 137 L56 148 L45 158"/><path d="M76 174 L71 179 L65 184 L61 189 L58 196"/><path d="M70 144 L75 158 L76 174 L79 189 L85 203 L94 216"/><path d="M24 231 L26 237 L28 244 L28 250 L32 256"/><path d="M45 210 L35 220 L24 231 L18 244 L9 256"/><path d="M51 237 L57 240 L60 243 L65 248 L70 252"/><path d="M44 224 L51 237 L61 248 L68 260 L76 272"/><path d="M102 97 L95 109 L87 120 L79 133 L70 144 L61 155 L55 169 L51 182 L49 196 L45 210 L44 224 L43 238"/><path d="M113 121 L114 134 L113 146 L114 158 L114 171"/><path d="M197 249 L197 254 L197 261 L197 267 L197 274"/><path d="M173 196 L185 208 L192 222 L197 235 L197 249"/><path d="M103 110 L113 121 L121 132 L131 143 L142 152 L151 161 L158 173 L166 184 L173 196 L177 210"/><path d="M102 124 L90 135 L82 146 L74 158 L66 171 L59 184 L52 197 L47 210 L43 224 L44 239 L48 253 L50 268"/><path d="M50 189 L39 197 L29 207 L23 219 L15 231"/><path d="M98 138 L87 146 L77 157 L67 168 L58 178 L50 189 L45 202 L37 214 L29 225 L22 237"/><path d="M10 346 L23 354 L35 363 L46 372 L59 380 L70 389"/><path d=       <svg class="bolt bolt--2" viewBox="0 0 200 400" aria-hidden="true"><use href="#lb" class="halo"/><use href="#lb" class="glow"/><use href="#lb" class="channel"/></svg>
      <svg class="bolt bolt--3" viewBox="0 0 200 400" aria-hidden="true"><use href="#lb" class="halo"/><use href="#lb" class="glow"/><use href="#lb" class="channel"/></svg>
      <span class="rain rain--far" aria-hidden="true"></span>
      <span class="rain rain--mid" aria-hidden="true"></span>
      <span class="rain rain--near" aria-hidden="true"></span>
      <span class="glass glass--a" aria-hidden="true"></span>
      <span class="glass glass--b" aria-hidden="true"></span>
      <span class="lamp" aria-hidden="true"></span>
      <span class="scrim" aria-hidden="true"></span>
      <div class="content">
        <h1>Night Desk Terrarium</h1>
        <p>
          A cozy pixel sandbox. Pour sand and water, light a hearth, grow moss and
          moonlit flowers — no score, no timer, nothing to win.
        </p>
        <button class="play" id="play" type="button">Enter the terrarium</button>
        <span class="hint" id="hint">Loads on click · sound is off until you turn it on</span>
      </div>
    </div>

    <script>
      // Swap the poster for the real app only once the visitor asks for it. Same-origin,
      // so the sandbox keeps normal access to localStorage and can save scenes.
      // The whole card is clickable for convenience, while the real <button> inside it is
      // the keyboard and screen-reader target.
      function enter() {
          const poster = document.getElementById("poster");
          const frame = document.createElement("iframe");
          frame.src = "index.html";
          frame.title = "Night Desk Terrarium";
          frame.allow = "autoplay; fullscreen";
          // If the app never arrives — a deploy mid-flight, a dropped connection — put the
          // poster back rather than leaving a dead frame the visitor cannot retry from.
          const giveUp = setTimeout(() => {
            document.body.replaceChildren(poster);
            document.getElementById("hint").textContent = "That did not load — click to try again";
            document.getElementById("poster").addEventListener("click", enter, { once: true });
          }, 20000);
          frame.addEventListener("load", () => clearTimeout(giveUp), { once: true });
          document.body.replaceChildren(frame);
          frame.focus();
      }
      document.getElementById("poster").addEventListener("click", enter, { once: true });
    </script>
  </body>
</html>
