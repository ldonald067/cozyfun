<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Desk Terrarium — a cozy pixel sandbox</title>
    <meta name="robots" content="noindex" />
    <!--
      Click-to-load shell for embedding the sandbox in a page on another site.

      The point is weight. The app is ~9 MB with its ambience beds, and an embed that
      autoloads makes every visitor who scrolls past pay for it. This poster is a few KB
      and pulls in nothing until someone actually asks to play.

      Everything on it — falling rain, condensation beaded on the glass, and the distant
      lightning bloom — is tiling CSS gradients rather than images or canvas, so the whole
      card stays a few KB and costs nothing to fetch. Each layer is a repeating strip of
      dashes translated by exactly one tile height, which loops seamlessly, and the only
      animated property is `transform` so it composites on the GPU without repainting.

      Every path here is relative, so this file works unchanged at a domain root or under
      a subpath — it always sits next to the index.html it launches, whatever COZY_BASE
      was set to at build time.

      Host this on the SAME ORIGIN as the page embedding it. Served cross-origin (from
      itch.io, say) the sandbox becomes a third-party frame, and Safari blocks its
      localStorage outright while Chrome partitions it — which silently breaks saving a
      terrarium, the one thing players want to keep.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #091018;
        color: #e8ecf2;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
        background: radial-gradient(120% 90% at 50% 12%, #1b2534 0%, #0d1421 55%, #070c13 100%);
      }

      /* Two rain layers at different size, speed, and opacity read as depth: the near
         sheet is longer, brighter, and faster, the far one finer and slower. Both are
         oversized and rotated so the slanted streaks still cover the corners. */
      .rain {
        position: absolute;
        inset: -40%;
        pointer-events: none;
        background-repeat: repeat;
        will-change: transform;
      }
      /* Each drop is an elongated ellipse. A one-dimensional linear-gradient cannot leave
         gaps along both axes — its band spans the whole tile width, so neighbouring tiles
         merge into unbroken stripes and the card reads as venetian blinds.

         Real rain is long, fine and dense rather than short and sparse: streaks here run
         40-70px tall but barely a pixel wide, so they read as motion blur. Three depths,
         each denser and dimmer than the last, do the rest. */
      .rain--far {
        background-image:
          radial-gradient(2px 3px at 22% 12%, rgba(176, 202, 232, 0.40), transparent 72%),
          radial-gradient(1.5px 2.5px at 68% 44%, rgba(176, 202, 232, 0.34), transparent 72%),
          radial-gradient(2px 3px at 44% 78%, rgba(176, 202, 232, 0.36), transparent 72%);
        background-size: 46px 118px;
        animation: rain-far 1.25s linear infinite;
      }
      .rain--mid {
        background-image:
          radial-gradient(3px 4.5px at 16% 20%, rgba(198, 222, 248, 0.48), rgba(150, 182, 216, 0.14) 58%, transparent 74%),
          radial-gradient(2.5px 3.5px at 58% 58%, rgba(198, 222, 248, 0.40), transparent 72%),
          radial-gradient(3px 4px at 86% 34%, rgba(198, 222, 248, 0.42), transparent 72%);
        background-size: 58px 152px;
        animation: rain-mid 0.82s linear infinite;
      }
      .rain--near {
        background-image:
          radial-gradient(5px 7px at 30% 24%, rgba(224, 239, 255, 0.55), rgba(158, 190, 224, 0.16) 56%, transparent 72%),
          radial-gradient(4px 5.5px at 74% 62%, rgba(224, 239, 255, 0.46), rgba(158, 190, 224, 0.12) 56%, transparent 72%),
          radial-gradient(3px 4px at 52% 88%, rgba(224, 239, 255, 0.40), transparent 72%);
        background-size: 88px 210px;
        animation: rain-near 0.62s linear infinite;
      }
      /* Translating by exactly one tile height puts the pattern back where it started,
         so the loop has no visible seam. The rotate has to be repeated in both keyframes
         or the animation would override it. */
      @keyframes rain-far {
        from { transform: rotate(11deg) translateY(-118px); }
        to   { transform: rotate(11deg) translateY(0); }
      }
      @keyframes rain-mid {
        from { transform: rotate(11deg) translateY(-152px); }
        to   { transform: rotate(11deg) translateY(0); }
      }
      @keyframes rain-near {
        from { transform: rotate(11deg) translateY(-210px); }
        to   { transform: rotate(11deg) translateY(0); }
      }

      /* Condensation clinging to the inside of the glass, in front of the falling rain so
         the two read as different distances: weather outside, window between. Each bead is
         a bright core fading to a faint rim, which is enough to look lens-like at this size.
         Beads do not move — they cling — so this layer is static and costs nothing to run. */
      .glass {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .glass--a {
        background-image:
          radial-gradient(circle 3px at 12% 18%, rgba(228, 241, 255, 0.40), rgba(140, 170, 200, 0.10) 62%, transparent 74%),
          radial-gradient(circle 5px at 63% 34%, rgba(228, 241, 255, 0.34), rgba(140, 170, 200, 0.10) 62%, transparent 74%),
          radial-gradient(circle 2px at 84% 11%, rgba(228, 241, 255, 0.38), transparent 72%),
          radial-gradient(circle 4px at 37% 71%, rgba(228, 241, 255, 0.32), rgba(140, 170, 200, 0.09) 62%, transparent 74%),
          radial-gradient(circle 2px at 78% 84%, rgba(228, 241, 255, 0.32), transparent 72%),
          radial-gradient(circle 3px at 20% 92%, rgba(228, 241, 255, 0.28), transparent 74%);
        background-size: 184px 202px;
      }
      .glass--b {
        background-image:
          radial-gradient(circle 2px at 45% 8%, rgba(228, 241, 255, 0.30), transparent 72%),
          radial-gradient(circle 4px at 88% 48%, rgba(228, 241, 255, 0.30), rgba(140, 170, 200, 0.08) 62%, transparent 74%),
          radial-gradient(circle 2px at 8% 62%, rgba(228, 241, 255, 0.26), transparent 72%),
          radial-gradient(circle 3px at 58% 88%, rgba(228, 241, 255, 0.26), transparent 74%);
        background-size: 137px 151px;
        background-position: 40px 25px;
      }

      /* Lightning needs a fork, and a gradient cannot make one — a bolt is a line with
         branches, so it is drawn as SVG paths. Inline, so it still costs no extra request.
         The wide soft stroke underneath is the glow; the thin bright one is the channel. */
      .bolt {
        position: absolute;
        top: -3%;
        opacity: 0;
        pointer-events: none;
        /* Sized by HEIGHT, not width. The viewBox is 44x200, so a 165px width would render
           a bolt 750px tall — taller than the card, straight through the title. */
        width: auto;
        /* The halo carries the violet; the strokes carry blue into white. */
        filter: drop-shadow(0 0 10px rgba(150, 112, 246, 0.55)) drop-shadow(0 0 4px rgba(150, 190, 255, 0.85));
      }
      .bolt--1 { left: 7%;  height: clamp(96px, 40%, 240px); animation: strike 13s ease-out infinite; }
      .bolt--2 { left: 39%; height: clamp(68px, 28%, 168px); animation: strike 13s ease-out 4.2s infinite; }
      .bolt--3 { right: 6%; height: clamp(84px, 34%, 205px); animation: strike 13s ease-out 8.6s infinite; }
      /* Three stacked strokes make the purple-blue-white gradient a bolt actually has:
         a wide violet bloom, a blue sheath inside it, and a white-hot channel down the
         middle. Painting order is widest first so each sits inside the last. */
      .bolt .halo    { stroke: rgba(158, 116, 250, 0.42); stroke-width: 9; }
      .bolt .glow    { stroke: rgba(126, 176, 255, 0.62); stroke-width: 4.5; }
      .bolt .channel { stroke: rgba(247, 250, 255, 0.96); stroke-width: 1.7; }
      .bolt path { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* A real strike is over in a blink and usually flickers twice. Most of the 13s cycle
         is dark, so it stays weather rather than a strobe. */
      @keyframes strike {
        0%, 5.5%, 100% { opacity: 0; }
        0.6%           { opacity: 1; }
        1.6%           { opacity: 0.12; }
        2.8%           { opacity: 0.8; }
        4.4%           { opacity: 0; }
      }

      /* The sky lifting behind the bolt — what actually sells it as distance. */
      .flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(130% 85% at 50% -10%, rgba(196, 206, 255, 0.5), rgba(142, 112, 220, 0.22) 34%, transparent 64%);
        animation: storm 13s ease-out infinite;
      }
      @keyframes storm {
        0%, 5.5%, 100% { opacity: 0; }
        0.7%           { opacity: 0.55; }
        1.8%           { opacity: 0.08; }
        3%             { opacity: 0.4; }
        4.6%           { opacity: 0; }
      }

      /* Warm lamplight pooling at the bottom — the reason it reads as cosy rain seen from
         indoors rather than as weather. */
      .lamp {
        position: absolute;
        inset: auto 0 -12% 0;
        height: 62%;
        pointer-events: none;
        background: radial-gradient(58% 100% at 50% 100%, rgba(244, 223, 184, 0.11), transparent 72%);
      }
      /* Keeps the rain from crawling over the type. */
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(46% 40% at 50% 48%, rgba(7, 12, 19, 0.72), transparent 75%);
      }

      .content {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: clamp(1.25rem, 5vw, 3rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font: 600 clamp(1.35rem, 3.4vw, 2rem)/1.2 Georgia, "Iowan Old Style", serif;
        color: #f4dfb8;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 18px rgba(7, 12, 19, 0.9);
      }
      p {
        margin: 0;
        max-width: 46ch;
        color: #a8bccd;
        font-size: clamp(0.9rem, 1.6vw, 1rem);
        text-shadow: 0 1px 12px rgba(7, 12, 19, 0.85);
      }
      .play {
        margin-top: 0.4rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid rgba(244, 223, 184, 0.42);
        border-radius: 999px;
        background: rgba(244, 223, 184, 0.1);
        color: #f4dfb8;
        font: 600 1rem/1 inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        backdrop-filter: blur(2px);
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }
      .poster:hover .play,
      .play:focus-visible {
        background: rgba(244, 223, 184, 0.19);
        border-color: rgba(244, 223, 184, 0.75);
        transform: translateY(-1px);
      }
      .play:focus-visible { outline: 2px solid #f4dfb8; outline-offset: 3px; }
      .hint { font-size: 0.78rem; color: #7b91a4; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }

      /* Motion is decoration here, so drop it entirely when it is unwelcome — the rain
         stays as a still texture rather than disappearing. */
      @media (prefers-reduced-motion: reduce) {
        .rain { animation: none; transform: rotate(11deg); }
        /* The beads are static anyway; the storm is pure motion, so it goes entirely. */
        .flash, .bolt { animation: none; opacity: 0; }
        .play { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="poster" id="poster">
      <span class="flash" aria-hidden="true"></span>
      <svg class="bolt bolt--1" viewBox="0 0 44 200" aria-hidden="true"><path class="halo" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="halo" d="M19 58 L3 92"/><path class="halo" d="M14 132 L34 168"/><path class="glow" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="glow" d="M19 58 L3 92"/><path class="glow" d="M14 132 L34 168"/><path class="channel" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="channel" d="M19 58 L3 92"/><path class="channel" d="M14 132 L34 168"/></svg>
      <svg class="bolt bolt--2" viewBox="0 0 44 200" aria-hidden="true"><path class="halo" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="halo" d="M19 58 L3 92"/><path class="halo" d="M14 132 L34 168"/><path class="glow" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="glow" d="M19 58 L3 92"/><path class="glow" d="M14 132 L34 168"/><path class="channel" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="channel" d="M19 58 L3 92"/><path class="channel" d="M14 132 L34 168"/></svg>
      <svg class="bolt bolt--3" viewBox="0 0 44 200" aria-hidden="true"><path class="halo" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="halo" d="M19 58 L3 92"/><path class="halo" d="M14 132 L34 168"/><path class="glow" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="glow" d="M19 58 L3 92"/><path class="glow" d="M14 132 L34 168"/><path class="channel" d="M32 0 L19 58 L35 62 L14 132 L31 137 L9 200"/><path class="channel" d="M19 58 L3 92"/><path class="channel" d="M14 132 L34 168"/></svg>
      <span class="rain rain--far" aria-hidden="true"></span>
      <span class="rain rain--mid" aria-hidden="true"></span>
      <span class="rain rain--near" aria-hidden="true"></span>
      <span class="glass glass--a" aria-hidden="true"></span>
      <span class="glass glass--b" aria-hidden="true"></span>
      <span class="lamp" aria-hidden="true"></span>
      <span class="scrim" aria-hidden="true"></span>
      <div class="content">
        <h1>Night Desk Terrarium</h1>
        <p>
          A cozy pixel sandbox. Pour sand and water, light a hearth, grow moss and
          moonlit flowers — no score, no timer, nothing to win.
        </p>
        <button class="play" id="play" type="button">Enter the terrarium</button>
        <span class="hint">Loads on click · sound is off until you turn it on</span>
      </div>
    </div>

    <script>
      // Swap the poster for the real app only once the visitor asks for it. Same-origin,
      // so the sandbox keeps normal access to localStorage and can save scenes.
      // The whole card is clickable for convenience, while the real <button> inside it is
      // the keyboard and screen-reader target.
      document.getElementById("poster").addEventListener(
        "click",
        () => {
          const frame = document.createElement("iframe");
          frame.src = "index.html";
          frame.title = "Night Desk Terrarium";
          frame.allow = "autoplay; fullscreen";
          document.body.replaceChildren(frame);
          frame.focus();
        },
        { once: true }
      );
    </script>
  </body>
</html>
