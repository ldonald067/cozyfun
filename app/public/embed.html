<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Desk Terrarium — a cozy pixel sandbox</title>
    <meta name="robots" content="noindex" />
    <!-- RELATIVE, unlike index.html: this file is copied verbatim out of public/, so
         Vite never rewrites it and a leading slash would break every subpath deploy. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" sizes="32x32" />
    <!--
      Click-to-load shell for embedding the sandbox in a page on another site.

      The point is weight. The app is ~7 MB with its ambience beds, and an embed that
      autoloads makes every visitor who scrolls past pay for it. This poster is ~45 KB
      (~14 KB compressed) and pulls in nothing until someone actually asks to play.

      Nothing here is an image file. The scene is a watercolour that the script at the
      bottom paints into canvases, once on load and again on resize: the night sky behind
      the rain, and the desk and terrarium in front of it. Rain and condensation are tiling
      CSS gradients; the lightning is inline SVG, generated once as a fractal and
      referenced three times. The card fetches no sub-resources at all, against roughly
      440 KB of PNGs for the CodePen the rain borrows from.

      Two things were deliberately not borrowed. That reference animates
      `background-position`, which repaints every frame instead of compositing, and its
      travel is not a whole number of tiles, so the field visibly resets each cycle. Both
      are avoided here by translating whole tiles with `transform` (see the note above
      the rain keyframes).

      Every path here is relative, so this file works unchanged at a domain root or under
      a subpath — it always sits next to the index.html it launches, whatever COZY_BASE
      was set to at build time.

      Host this on the same SITE as the page embedding it — same registrable domain, which
      a subdomain satisfies. That is the boundary browsers actually enforce: Chrome
      partitions storage by top-level site and Safari's ITP judges third-party by
      registrable domain, so pixelfun.littlealbumclub.net inside littlealbumclub.net is not
      a third party even though it is a different origin. A wholly different domain
      (itch.io, say) is, and there the sandbox loses localStorage — silently breaking saved
      terrariums, the one thing players want to keep.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #091018;
        color: #e8ecf2;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
        /* Stands in until the painting exists, and for good if the script never runs. */
        background: radial-gradient(120% 90% at 50% 12%, #222a48 0%, #171d33 55%, #0e1222 100%);
      }

      /* The painting is two canvases with the weather between them: the sky at the back,
         the desk and terrarium at the front, so rain falls outside the window and never
         across the jar. Both are painted once and left alone, so they cost nothing per
         frame; everything that moves is a transform or an opacity between or above them. */
      .paint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      /* Three sheets at different drop size, speed and opacity read as depth: the near one
         largest, brightest and fastest, the far one finest and slowest. The slant comes
         from the drift keyframe below, not from a rotation, so these sit flush in the frame.
         Each sheet starts a little more than one cycle's travel above and left of the frame:
         a sheet flush with it slid off its own top-left corner as it fell, leaving a strip
         there with no drops for that sheet for most of every cycle. */
      .rain {
        position: absolute;
        inset: -330px 0 0 -90px;
        pointer-events: none;
        background-repeat: repeat;
        will-change: transform;
      }
      /* Drops are small ovals, 1-3px, not streaks. Compositing the reference's rain PNG
         over a dark field shows its texture is speckle too — what turns those dots into
         rain is speed, not shape: they move fast enough to smear in the eye. Drawing the
         blur instead, as long thin streaks, looked like scratches; drawing large slow
         drops looked like snow.

         Each drop is a radial gradient because a one-dimensional linear-gradient cannot
         leave gaps along both axes — its band spans the whole tile width, so neighbouring
         tiles merge into unbroken stripes and the card reads as venetian blinds. The tint
         is the paper's, a touch of lavender, so the rain sits in the painting's palette. */
      .rain--far {
        background-image:
          radial-gradient(1.2px 1.8px at 22% 12%, rgba(190, 196, 232, 0.42), transparent 70%),
          radial-gradient(1px 1.5px at 68% 44%, rgba(190, 196, 232, 0.36), transparent 70%),
          radial-gradient(1.2px 1.8px at 44% 78%, rgba(190, 196, 232, 0.38), transparent 70%),
          radial-gradient(1px 1.4px at 84% 88%, rgba(190, 196, 232, 0.32), transparent 70%);
        background-size: 51px 96px;
        animation: rain-far 0.34s linear infinite;
      }
      .rain--mid {
        background-image:
          radial-gradient(1.6px 2.4px at 16% 20%, rgba(210, 214, 246, 0.50), transparent 70%),
          radial-gradient(1.4px 2px at 58% 58%, rgba(210, 214, 246, 0.42), transparent 70%),
          radial-gradient(1.5px 2.2px at 86% 34%, rgba(210, 214, 246, 0.44), transparent 70%),
          radial-gradient(1.2px 1.8px at 36% 86%, rgba(210, 214, 246, 0.38), transparent 70%);
        background-size: 66px 124px;
        animation: rain-mid 0.26s linear infinite;
      }
      .rain--near {
        background-image:
          radial-gradient(2.2px 3.2px at 30% 24%, rgba(236, 236, 252, 0.58), transparent 68%),
          radial-gradient(1.9px 2.8px at 74% 62%, rgba(236, 236, 252, 0.50), transparent 68%),
          radial-gradient(1.7px 2.4px at 52% 88%, rgba(236, 236, 252, 0.44), transparent 68%);
        background-size: 85px 158px;
        animation: rain-near 0.2s linear infinite;
      }

      /* Each layer slides exactly one tile across and two down per cycle, so the pattern
         lands back on itself and the loop has no seam. The reference animates
         background-position from 0% 0% to 20% 100% instead, which is where the slant idea
         came from — but a percentage background-position resolves to
         (container - tile) * percentage, so its travel is almost never a whole number of
         tiles. Measured in this frame that snapped the near field 146px, roughly a whole
         tile, three times a second. Whole-tile transforms also make the motion independent
         of frame size, and animate a compositor property instead of forcing a repaint.
         Ratios are chosen so all three fall at about 15 degrees. */
      @keyframes rain-far  { to { transform: translate(51px, 192px); } }
      @keyframes rain-mid  { to { transform: translate(66px, 248px); } }
      @keyframes rain-near { to { transform: translate(85px, 316px); } }

      /* Condensation clinging to the inside of the glass, in front of the falling rain so
         the two read as different distances: weather outside, window between. Each bead is
         a pale core inside a darker ring, the way a drop of water dropped into a drying wash
         pushes pigment out to its edge. Beads do not move — they cling — so this layer is
         static and costs nothing to run. */
      .glass {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .glass--a {
        background-image:
          radial-gradient(circle 3px at 12% 18%, rgba(236, 234, 252, 0.34), rgba(236, 234, 252, 0.12) 52%, rgba(16, 18, 40, 0.34) 70%, transparent 80%),
          radial-gradient(circle 5px at 63% 34%, rgba(236, 234, 252, 0.30), rgba(236, 234, 252, 0.10) 52%, rgba(16, 18, 40, 0.32) 70%, transparent 80%),
          radial-gradient(circle 2px at 84% 11%, rgba(236, 234, 252, 0.36), rgba(16, 18, 40, 0.26) 66%, transparent 80%),
          radial-gradient(circle 4px at 37% 71%, rgba(236, 234, 252, 0.28), rgba(236, 234, 252, 0.09) 52%, rgba(16, 18, 40, 0.30) 70%, transparent 80%),
          radial-gradient(circle 2px at 78% 84%, rgba(236, 234, 252, 0.30), rgba(16, 18, 40, 0.24) 66%, transparent 80%),
          radial-gradient(circle 3px at 20% 92%, rgba(236, 234, 252, 0.26), rgba(16, 18, 40, 0.24) 68%, transparent 80%);
        background-size: 184px 202px;
      }
      .glass--b {
        background-image:
          radial-gradient(circle 2px at 45% 8%, rgba(236, 234, 252, 0.28), rgba(16, 18, 40, 0.22) 66%, transparent 80%),
          radial-gradient(circle 4px at 88% 48%, rgba(236, 234, 252, 0.28), rgba(236, 234, 252, 0.08) 52%, rgba(16, 18, 40, 0.28) 70%, transparent 80%),
          radial-gradient(circle 2px at 8% 62%, rgba(236, 234, 252, 0.24), rgba(16, 18, 40, 0.20) 66%, transparent 80%),
          radial-gradient(circle 3px at 58% 88%, rgba(236, 234, 252, 0.24), rgba(16, 18, 40, 0.22) 68%, transparent 80%);
        background-size: 137px 151px;
        background-position: 40px 25px;
      }

      /* A few beads let go and run down the glass the way drops do: they cling and creep,
         slip, catch on another bead, then run to the sill, where the desk hides them. The
         trail rides with the head. Four drips on long, unrelated cycles never line up. */
      .drip {
        position: absolute;
        width: 8px;
        height: 54px;
        opacity: 0;
        pointer-events: none;
        background:
          radial-gradient(circle 3.5px at 50% calc(100% - 4px), rgba(244, 242, 255, 0.62), rgba(244, 242, 255, 0.2) 55%, rgba(16, 18, 40, 0.5) 72%, transparent 84%) no-repeat,
          linear-gradient(to bottom, transparent, rgba(226, 230, 250, 0.14) 60%, rgba(226, 230, 250, 0.26) 90%, transparent) 50% 0 / 2px 92% no-repeat;
        animation: drip 16s cubic-bezier(0.5, 0, 0.9, 0.6) infinite;
      }
      .drip--1 { left: 9%;  top: 4%;  --fall: 76vh; animation-duration: 17s; animation-delay: -2s; }
      .drip--2 { left: 31%; top: 14%; --fall: 66vh; animation-duration: 23s; animation-delay: -15s; }
      .drip--3 { left: 61%; top: 2%;  --fall: 78vh; animation-duration: 19s; animation-delay: -9s; }
      .drip--4 { left: 92%; top: 20%; --fall: 60vh; animation-duration: 29s; animation-delay: -21s; }
      @keyframes drip {
        0%        { transform: translateY(0); opacity: 0; }
        5%        { opacity: 1; }
        34%       { transform: translateY(calc(var(--fall) * 0.06)); }
        46%       { transform: translateY(calc(var(--fall) * 0.42)); }
        58%       { transform: translateY(calc(var(--fall) * 0.47)); }
        70%       { transform: translateY(var(--fall)); opacity: 1; }
        74%, 100% { transform: translateY(var(--fall)); opacity: 0; }
      }

      /* A gradient cannot make a fork, so the bolt is SVG. Its 44 branches were generated
         by a seeded fractal walk rather than drawn by hand — the reference bolt is dozens
         of hairlines forking recursively, which is not something to author by hand. The
         geometry is defined once and referenced by all three placements and all three
         stroke passes; writing it out per pass would have cost 59 KB instead of 3. */
      .bolt {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        overflow: visible;
        /* Violet bloom outside, blue nearer in — the halo does the colour work that a
           stroke this thin cannot. */
        filter: drop-shadow(0 0 10px rgba(170, 132, 250, 0.45)) drop-shadow(0 0 3px rgba(214, 218, 255, 0.7));
      }
      /* One bolt, placed three times at different scales and angles — the reference does
         exactly this with three copies of a single image, and it is why the markup stays
         small: the 44 branches are written once and referenced. */
      .bolt--1 { top: -6%; left: 4%;  height: clamp(150px, 62%, 380px); transform: rotate(-4deg); animation: strike 13s ease-out infinite; }
      .bolt--2 { top: -10%; left: 34%; height: clamp(110px, 46%, 280px); transform: rotate(9deg) scaleX(-1); animation: strike 13s ease-out 4.2s infinite; }
      .bolt--3 { top: -4%; right: 2%; height: clamp(130px, 54%, 330px); transform: rotate(6deg); animation: strike 13s ease-out 8.6s infinite; }
      /* In a watercolour, lightning is the paper itself, kept white with masking fluid
         while the sky was laid in. So the channel is paper-cream rather than electric, and
         the #wob filter roughens every pass, since a masked line is never ruler-smooth. */
      .bolt .halo    { stroke: rgba(172, 140, 246, 0.26); stroke-width: 4.6; }
      .bolt .glow    { stroke: rgba(198, 208, 255, 0.5); stroke-width: 1.8; }
      .bolt .channel { stroke: rgba(255, 249, 236, 0.96); stroke-width: 0.8; }
      .bolt use { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* A real strike is over in a blink and usually flickers twice. Most of the 13s cycle
         is dark, so it stays weather rather than a strobe. */
      @keyframes strike {
        0%, 5.5%, 100% { opacity: 0; }
        0.6%           { opacity: 1; }
        1.6%           { opacity: 0.12; }
        2.8%           { opacity: 0.8; }
        4.4%           { opacity: 0; }
      }

      /* The sky lifting behind the bolt — what actually sells it as distance. It is a
         painted wash rather than a gradient, so it blooms with ragged edges like the rest of
         the sky. One canvas carries every strike, so it flickers at each bolt's delay
         (4.2s and 8.6s of 13s): a single un-staggered flash once lit only the first strike
         and left the other two firing into an unlit sky. */
      .flash {
        opacity: 0;
        animation: storm 13s ease-out infinite;
      }
      @keyframes storm {
        0%, 5.5%, 32.3%, 37.8%, 66.2%, 71.7%, 100% { opacity: 0; }
        0.7%  { opacity: 0.55; }
        1.8%  { opacity: 0.08; }
        3%    { opacity: 0.4; }
        4.6%  { opacity: 0; }
        33%   { opacity: 0.55; }
        34.1% { opacity: 0.08; }
        35.3% { opacity: 0.4; }
        36.9% { opacity: 0; }
        66.9% { opacity: 0.55; }
        68%   { opacity: 0.08; }
        69.2% { opacity: 0.4; }
        70.8% { opacity: 0; }
      }

      /* Keeps the rain, and a strike, from crawling over the type. */
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(46% 40% at 50% 48%, rgba(12, 14, 30, 0.66), transparent 75%);
      }
      /* On a phone the text block is nearly the frame's width, and a scrim sized for a wide
         frame left a strike behind the paragraph at 3:1. (A max() floor on the gradient's
         size would say this in one rule, but Chrome rejects math in a gradient size and
         drops the whole scrim.) */
      @media (max-width: 560px) {
        .scrim { background: radial-gradient(78% 36% at 50% 48%, rgba(12, 14, 30, 0.74), transparent 78%); }
      }

      .content {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: clamp(1.25rem, 5vw, 3rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font: 600 clamp(1.35rem, 3.4vw, 2rem)/1.2 Georgia, "Iowan Old Style", serif;
        color: #f4dfb8;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 18px rgba(10, 12, 26, 0.9);
      }
      p {
        margin: 0;
        max-width: 46ch;
        color: #b4c2d6;
        font-size: clamp(0.9rem, 1.6vw, 1rem);
        text-shadow: 0 1px 12px rgba(10, 12, 26, 0.85);
      }
      .play {
        margin-top: 0.4rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid rgba(244, 223, 184, 0.42);
        border-radius: 999px;
        background: rgba(244, 223, 184, 0.1);
        color: #f4dfb8;
        font: 600 1rem/1 inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        backdrop-filter: blur(2px);
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }
      .poster:hover .play,
      .play:focus-visible {
        background: rgba(244, 223, 184, 0.19);
        border-color: rgba(244, 223, 184, 0.75);
        transform: translateY(-1px);
      }
      .play:focus-visible { outline: 2px solid #f4dfb8; outline-offset: 3px; }
      .hint { font-size: 0.78rem; color: #8b9bb4; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }

      /* Motion is decoration here, so drop it entirely when it is unwelcome — the rain
         stays as a still texture rather than disappearing. */
      @media (prefers-reduced-motion: reduce) {
        .rain { animation: none; }
        /* The beads are static anyway; the storm and the drips are pure motion, so they
           go entirely. */
        .flash, .bolt { animation: none; opacity: 0; }
        .drip { animation: none; display: none; }
        .play { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="poster" id="poster">
      <canvas class="paint" id="sky" aria-hidden="true"></canvas>
      <canvas class="paint flash" id="flash" aria-hidden="true"></canvas>
      <svg class="bolt bolt--1" viewBox="0 0 200 400" aria-hidden="true"><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter><g id="lb"><path d="M110 55 L109 63 L107 72 L102 79 L100 87"/><path d="M121 100 L115 104 L111 110 L106 116 L102 122"/><path d="M101 41 L110 55 L116 69 L120 84 L121 100 L120 115"/><path d="M83 139 L91 152 L97 166 L100 181 L100 196"/><path d="M69 163 L57 172 L48 184 L39 196 L32 210"/><path d="M97 14 L101 27 L101 41 L99 55 L97 69 L93 83 L92 97 L90 111 L87 125 L83 139 L77 151 L69 163"/><path d="M99 94 L96 98 L92 101 L88 103 L85 107"/><path d="M88 121 L87 125 L86 130 L86 135 L85 140"/><path d="M104 80 L99 94 L95 108 L88 121 L80 133"/><path d="M162 212 L165 215 L169 217 L172 220 L175 223"/><path d="M148 190 L157 200 L162 212 L167 224 L176 235"/><path d="M152 204 L164 213 L176 224 L186 236 L197 247"/><path d="M94 69 L104 80 L112 93 L118 106 L123 120 L126 135 L132 149 L137 162 L142 176 L148 190 L152 204"/><path d="M95 109 L100 121 L107 132 L116 141 L125 151"/><path d="M87 120 L76 128 L65 137 L56 148 L45 158"/><path d="M76 174 L71 179 L65 184 L61 189 L58 196"/><path d="M70 144 L75 158 L76 174 L79 189 L85 203 L94 216"/><path d="M24 231 L26 237 L28 244 L28 250 L32 256"/><path d="M45 210 L35 220 L24 231 L18 244 L9 256"/><path d="M51 237 L57 240 L60 243 L65 248 L70 252"/><path d="M44 224 L51 237 L61 248 L68 260 L76 272"/><path d="M102 97 L95 109 L87 120 L79 133 L70 144 L61 155 L55 169 L51 182 L49 196 L45 210 L44 224 L43 238"/><path d="M113 121 L114 134 L113 146 L114 158 L114 171"/><path d="M197 249 L197 254 L197 261 L197 267 L197 274"/><path d="M173 196 L185 208 L192 222 L197 235 L197 249"/><path d="M103 110 L113 121 L121 132 L131 143 L142 152 L151 161 L158 173 L166 184 L173 196 L177 210"/><path d="M102 124 L90 135 L82 146 L74 158 L66 171 L59 184 L52 197 L47 210 L       <svg class="bolt bolt--2" viewBox="0 0 200 400" aria-hidden="true"><g filter="url(#wob)"><use href="#lb" class="halo"/><use href="#lb" class="glow"/><use href="#lb" class="channel"/></g></svg>
      <svg class="bolt bolt--3" viewBox="0 0 200 400" aria-hidden="true"><g filter="url(#wob)"><use href="#lb" class="halo"/><use href="#lb" class="glow"/><use href="#lb" class="channel"/></g></svg>
      <span class="rain rain--far" aria-hidden="true"></span>
      <span class="rain rain--mid" aria-hidden="true"></span>
      <span class="rain rain--near" aria-hidden="true"></span>
      <span class="glass glass--a" aria-hidden="true"></span>
      <span class="glass glass--b" aria-hidden="true"></span>
      <span class="drip drip--1" aria-hidden="true"></span>
      <span class="drip drip--2" aria-hidden="true"></span>
      <span class="drip drip--3" aria-hidden="true"></span>
      <span class="drip drip--4" aria-hidden="true"></span>
      <canvas class="paint" id="near" aria-hidden="true"></canvas>
      <span class="scrim" aria-hidden="true"></span>
      <div class="content">
        <h1>Night Desk Terrarium</h1>
        <p>
          A cozy pixel sandbox. Pour sand and water, light a hearth, grow moss and
          moonlit flowers — no score, no timer, nothing to win.
        </p>
        <button class="play" id="play" type="button">Enter the terrarium</button>
        <span class="hint" id="hint">Loads on click · sound is off until you turn it on</span>
      </div>
    </div>

    <script>
      // The watercolour. Painted here once, and again only when the frame changes size;
      // nothing in the canvases moves, so after load they cost nothing per frame.
      //
      // Washes follow Tyler Hobbs' layered-polygon method: a rough blob is frayed by
      // recursive midpoint displacement, then filled a few dozen times at a few percent
      // opacity, each fill frayed afresh. The overlap builds a dense middle that thins out
      // through a ragged, uneven edge, which is what pigment does as a wash dries. A seeded
      // generator paints the same picture on every load and every resize.
      (function () {
        const sky = document.getElementById("sky");
        const near = document.getElementById("near");
        const flash = document.getElementById("flash");
        if (!sky.getContext) return;
        // S is the painting's scale against its 960x620 design frame, in canvas pixels.
        let rand, S;

        function reseed(a) {
          rand = function () {
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function gauss() {
          let u = 0;
          while (!u) u = rand();
          return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * rand());
        }

        // Every edge gains a vertex pushed off its midpoint by an amount proportional to
        // the edge's length, so long edges wander and short ones fray. `v` is each vertex's
        // own roughness, inherited with a little drift, so one blob has both crisp and
        // feathered stretches of edge, as a real wash does.
        function deform(pts, times, k) {
          for (let d = 0; d < times; d++) {
            const out = [];
            for (let i = 0; i < pts.length; i++) {
              const a = pts[i], b = pts[(i + 1) % pts.length];
              const v = ((a.v + b.v) / 2) * (0.8 + rand() * 0.4);
              const sd = Math.hypot(b.x - a.x, b.y - a.y) * v * k;
              out.push(a, { x: (a.x + b.x) / 2 + gauss() * sd, y: (a.y + b.y) / 2 + gauss() * sd, v });
            }
            pts = out;
          }
          return pts;
        }
        function shape(pts, cx, cy) {
          const p = deform(pts, 2, 0.35);
          p.cx = cx;
          p.cy = cy;
          return p;
        }
        function blob(cx, cy, rx, ry, rough) {
          const pts = [];
          for (let i = 0; i < 10; i++) {
            const a = (i / 10) * 6.2832;
            pts.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, v: (0.3 + rand() * 0.6) * (rough || 1) });
          }
          return shape(pts, cx, cy);
        }
        // A band across the jar, flat-bottomed, with a slightly wandering top.
        function band(x0, x1, y0, y1) {
          const pts = [
            { x: x0, y: y0, v: 0.12 }, { x: (x0 + x1) / 2, y: y0 - 2 * S, v: 0.12 }, { x: x1, y: y0, v: 0.12 },
            { x: x1, y: y1, v: 0.04 }, { x: x0, y: y1, v: 0.04 },
          ];
          return shape(pts, (x0 + x1) / 2, (y0 + y1) / 2);
        }
        function trace(c, p) {
          c.beginPath();
          c.moveTo(p[0].x, p[0].y);
          for (let i = 1; i < p.length; i++) c.lineTo(p[i].x, p[i].y);
          c.closePath();
        }
        // One wash. `spread` scales each layer about the blob's centre, which is what
        // spreads a wet-into-wet edge over a wide soft band; `rim` strokes every layer
        // faintly in a darker colour, and the strokes pile up into the dark tide line a
        // wash leaves where it dried.
        function wash(c, base, rgb, layers, alpha, o) {
          o = o || {};
          c.fillStyle = "rgba(" + rgb + "," + alpha + ")";
          if (o.rim) {
            c.strokeStyle = "rgba(" + o.rim + "," + (o.rimAlpha || alpha * 1.6) + ")";
            c.lineWidth = 1.3 * S;
          }
          for (let i = 0; i < layers; i++) {
            const s = 1 + gauss() * (o.spread || 0.03);
            const layer = base.map((q) => ({ x: base.cx + (q.x - base.cx) * s, y: base.cy + (q.y - base.cy) * s, v: q.v }));
            trace(c, deform(layer, 3, o.k || 0.35));
            c.fill();
            if (o.rim) c.stroke();
          }
        }
        // Flicked off a loaded brush: mostly pale, a few dark.
        function spatter(c, W, H, n) {
          for (let i = 0; i < n; i++) {
            const light = rand() < 0.75;
            c.fillStyle = light
              ? "rgba(232, 230, 250, " + (0.05 + rand() * 0.2) + ")"
              : "rgba(8, 10, 24, " + (0.18 + rand() * 0.25) + ")";
            c.beginPath();
            c.arc(rand() * W, rand() * H, (0.35 + Math.pow(rand(), 3) * 2) * S, 0, 6.2832);
            c.fill();
          }
        }
        // Paper: a fine tooth plus slow blotches, multiplied in. Stronger in the darks,
        // because heavy pigment settles into the paper's hollows (granulation) while thin
        // washes lie clear. Rows above `top` are left alone, and so are empty pixels.
        function paper(c, W, H, top) {
          if (top >= H) return;
          const img = c.getImageData(0, top, W, H - top), d = img.data;
          // Two tooth octaves at unrelated sizes, so neither one's lattice shows.
          const cell = Math.max(2, 3.7 * S), fine = Math.max(1.3, 1.6 * S), big = 120 * S;
          const tw = Math.ceil(W / cell) + 2, fw = Math.ceil(W / fine) + 2, bw = Math.ceil(W / big) + 2;
          const tooth = new Float32Array(tw * (Math.ceil(H / cell) + 2)).map(rand);
          const grit = new Float32Array(fw * (Math.ceil(H / fine) + 2)).map(rand);
          const blots = new Float32Array(bw * (Math.ceil(H / big) + 2)).map(rand);
          function lerp(g, w, x, y) {
            const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * w + xi;
            return (g[i] * (1 - fx) + g[i + 1] * fx) * (1 - fy) + (g[i + w] * (1 - fx) + g[i + w + 1] * fx) * fy;
          }
          for (let y = top, o = 0; y < H; y++) {
            for (let x = 0; x < W; x++, o += 4) {
              if (!d[o + 3]) continue;
              const lum = (d[o] * 0.3 + d[o + 1] * 0.59 + d[o + 2] * 0.11) / 255;
              const t = lerp(tooth, tw, x / cell, y / cell) * 0.45 + lerp(grit, fw, x / fine, y / fine) * 0.35 + rand() * 0.2 - 0.5;
              const f = 1 + t * (0.18 + 0.22 * (1 - lum)) + (lerp(blots, bw, x / big, y / big) - 0.5) * 0.12;
              d[o] *= f;
              d[o + 1] *= f;
              d[o + 2] *= f;
            }
          }
          c.putImageData(img, 0, top);
        }

        function paintSky(c, W, H) {
          const g = c.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, "#151a30");
          g.addColorStop(0.45, "#212a4a");
          g.addColorStop(1, "#2b2846");
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
          // Wet into wet: big overlapping washes of Payne's grey, ultramarine, violet and a
          // little turquoise, none with an edge to speak of.
          wash(c, blob(0.5 * W, -0.08 * H, 0.8 * W, 0.34 * H), "10, 12, 26", 36, 0.035, { spread: 0.14 });
          wash(c, blob(0.22 * W, 0.34 * H, 0.34 * W, 0.26 * H), "44, 60, 128", 30, 0.028, { spread: 0.14 });
          wash(c, blob(0.8 * W, 0.24 * H, 0.3 * W, 0.22 * H), "40, 54, 120", 28, 0.028, { spread: 0.14 });
          wash(c, blob(0.56 * W, 0.52 * H, 0.32 * W, 0.22 * H), "76, 54, 122", 30, 0.026, { spread: 0.14 });
          wash(c, blob(0.96 * W, 0.66 * H, 0.2 * W, 0.26 * H), "82, 56, 118", 24, 0.026, { spread: 0.12 });
          wash(c, blob(0.06 * W, 0.62 * H, 0.2 * W, 0.24 * H), "30, 84, 104", 24, 0.028, { spread: 0.12 });
          // A band of cloud lifted out with a damp brush.
          wash(c, blob(0.42 * W, 0.15 * H, 0.36 * W, 0.07 * H), "120, 128, 184", 24, 0.016, { spread: 0.1 });
          // Lamplight on the glass, low and to the left: it lightens what is there rather
          // than covering it, so it goes on as screen.
          c.globalCompositeOperation = "screen";
          wash(c, blob(0.28 * W, 1.0 * H, 0.42 * W, 0.26 * H), "150, 82, 36", 18, 0.022, { spread: 0.14 });
          wash(c, blob(0.28 * W, 0.97 * H, 0.2 * W, 0.12 * H), "210, 140, 70", 14, 0.024, { spread: 0.14 });
          // Backruns: where wet paint crept back into a drying wash, leaving a pale
          // cauliflower inside a dark tide line.
          for (const [x, y, r] of [[0.14, 0.22, 0.05], [0.68, 0.38, 0.04], [0.88, 0.1, 0.034]]) {
            const b = blob(x * W, y * H, r * W * 1.4, r * W * 1.1, 1.3);
            c.globalCompositeOperation = "screen";
            wash(c, b, "80, 90, 150", 6, 0.022, { spread: 0.05 });
            c.globalCompositeOperation = "source-over";
            wash(c, b, "0, 0, 0", 4, 0, { rim: "8, 10, 24", rimAlpha: 0.06 });
          }
          c.globalCompositeOperation = "source-over";
          spatter(c, W, 0.86 * H, 110);
          paper(c, W, H, 0);
        }

        // The jar keeps a floor on its size, so on a tall phone frame it stays a terrarium
        // rather than a speck; everywhere wider it is simply the frame's scale.
        function terrarium(c, W, H, desk) {
          const frame = S;
          S = Math.max(S, 0.6 * H / 620);
          const top = jar(c, W, H, desk);
          S = frame;
          return top;
        }
        function jar(c, W, H, desk) {
          const jw = 108 * S, jh = 148 * S, r = jw * 0.2;
          const cx = W - Math.max(jw * 0.9, 0.17 * W), base = desk + 0.045 * H;
          const L = cx - jw / 2, R = cx + jw / 2, T = base - jh;
          const neck = jw * 0.3, nh = jh * 0.08, sh = jh * 0.2;
          function body() {
            c.beginPath();
            c.moveTo(L + r, base);
            c.lineTo(R - r, base);
            c.quadraticCurveTo(R, base, R, base - r);
            c.lineTo(R, T + nh + sh);
            c.quadraticCurveTo(R, T + nh, cx + neck, T + nh);
            c.lineTo(cx + neck, T);
            c.lineTo(cx - neck, T);
            c.lineTo(cx - neck, T + nh);
            c.quadraticCurveTo(L, T + nh, L, T + nh + sh);
            c.lineTo(L, base - r);
            c.quadraticCurveTo(L, base, L + r, base);
            c.closePath();
          }
          function leaf(x, y, angle, rgb) {
            c.save();
            c.translate(x, y);
            c.rotate(angle);
            wash(c, blob(4 * S, 0, 5 * S, 2.2 * S), rgb, 6, 0.22, { k: 0.2 });
            c.restore();
          }
          function stem(x0, y0, x1, y1, bend) {
            for (let i = 0; i < 3; i++) {
              c.beginPath();
              c.moveTo(x0 + gauss() * 0.4 * S, y0);
              c.quadraticCurveTo((x0 + x1) / 2 + bend, (y0 + y1) / 2, x1 + gauss() * 0.4 * S, y1);
              c.strokeStyle = "rgba(104, 148, 78, 0.45)";
              c.lineWidth = 1.3 * S;
              c.stroke();
            }
          }

          // Its shadow on the desk, thrown away from the lamp.
          wash(c, blob(cx + 0.2 * jw, base + 2 * S, jw * 0.66, 6 * S), "10, 6, 10", 14, 0.08, { k: 0.2 });

          c.save();
          body();
          c.clip();
          // Glass tints what is behind it.
          c.fillStyle = "rgba(30, 48, 66, 0.4)";
          c.fillRect(L - 2, T - 2, jw + 4, jh + 4);
          // The sandbox's own strata: sand, soil, then a moss bed.
          const soil = base - jh * 0.34, sand = base - jh * 0.22;
          wash(c, band(L - 6 * S, R + 6 * S, sand, base + 6 * S), "196, 152, 86", 14, 0.11, { rim: "120, 84, 40" });
          wash(c, band(L - 6 * S, R + 6 * S, soil, sand + 2 * S), "78, 50, 34", 14, 0.13, { rim: "30, 18, 14" });
          for (let i = 0; i < 5; i++) {
            const x = L + jw * (0.1 + i * 0.2 + gauss() * 0.03), w = (9 + rand() * 6) * S;
            wash(c, blob(x, soil, w, (5 + rand() * 3) * S), "70, 118, 56", 12, 0.14, { rim: "26, 50, 30" });
            wash(c, blob(x - w * 0.3, soil - 2 * S, w * 0.5, 2.5 * S), "136, 176, 92", 6, 0.1);
          }
          // A moonlit flower on a tall stem, and a rose one on a short stem.
          const fx = cx - 0.06 * jw, fy = T + jh * 0.34;
          stem(cx - 0.14 * jw, soil, fx, fy, -6 * S);
          leaf(cx - 0.12 * jw, soil - jh * 0.12, -2.4, "96, 146, 74");
          leaf(cx - 0.1 * jw, soil - jh * 0.22, -0.6, "96, 146, 74");
          // Its glow is the one smooth thing in the painting, on purpose: light, not pigment.
          const glow = c.createRadialGradient(fx, fy, 0, fx, fy, 26 * S);
          glow.addColorStop(0, "rgba(150, 170, 255, 0.34)");
          glow.addColorStop(0.4, "rgba(130, 150, 255, 0.12)");
          glow.addColorStop(1, "rgba(130, 150, 255, 0)");
          c.globalCompositeOperation = "screen";
          c.fillStyle = glow;
          c.fillRect(fx - 26 * S, fy - 26 * S, 52 * S, 52 * S);
          c.globalCompositeOperation = "source-over";
          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * 6.2832 - 1.57;
            c.save();
            c.translate(fx + Math.cos(a) * 3.6 * S, fy + Math.sin(a) * 3.6 * S);
            c.rotate(a);
            wash(c, blob(0, 0, 3.6 * S, 2.6 * S), "214, 224, 255", 6, 0.24, { k: 0.2 });
            c.restore();
          }
          c.fillStyle = "rgba(250, 236, 180, 0.7)";
          c.beginPath();
          c.arc(fx, fy, 1.6 * S, 0, 6.2832);
          c.fill();
          const rx = cx + 0.22 * jw, ry = soil - jh * 0.14;
          stem(cx + 0.2 * jw, soil, rx, ry, 3 * S);
          leaf(cx + 0.21 * jw, soil - jh * 0.06, -0.5, "96, 146, 74");
          wash(c, blob(rx, ry, 3.8 * S, 3.4 * S), "222, 116, 146", 8, 0.2, { k: 0.25, rim: "130, 50, 80" });
          // The lamp warms the near side of the glass; the far side falls into shadow.
          const warm = c.createLinearGradient(L, 0, cx, 0);
          warm.addColorStop(0, "rgba(240, 180, 110, 0.16)");
          warm.addColorStop(1, "rgba(240, 180, 110, 0)");
          c.globalCompositeOperation = "screen";
          c.fillStyle = warm;
          c.fillRect(L, T, jw, jh);
          c.globalCompositeOperation = "source-over";
          c.strokeStyle = "rgba(8, 10, 22, 0.28)";
          c.lineWidth = 7 * S;
          c.beginPath();
          c.moveTo(R, T + nh + sh * 0.6);
          c.lineTo(R, base);
          c.stroke();
          c.restore();

          // The glass itself: an outline laid twice, slightly off register as by hand, and
          // a highlight lifted out down the near side.
          c.lineWidth = 1.4 * S;
          c.strokeStyle = "rgba(214, 226, 246, 0.24)";
          body();
          c.stroke();
          c.save();
          c.translate(0.8 * S, 0.5 * S);
          c.strokeStyle = "rgba(214, 226, 246, 0.12)";
          body();
          c.stroke();
          c.restore();
          c.lineCap = "round";
          c.strokeStyle = "rgba(255, 240, 214, 0.42)";
          c.lineWidth = 2.6 * S;
          c.beginPath();
          c.moveTo(L + 0.14 * jw, T + nh + sh * 0.9);
          c.quadraticCurveTo(L + 0.08 * jw, base - jh * 0.45, L + 0.12 * jw, base - r * 1.2);
          c.stroke();
          c.lineWidth = 1.6 * S;
          c.beginPath();
          c.moveTo(L + 0.26 * jw, T + nh + sh * 0.35);
          c.lineTo(L + 0.32 * jw, T + nh + sh * 0.2);
          c.stroke();
          // A cork, with the lamp catching its top.
          const cw = neck * 1.1, ct = T - jh * 0.085;
          wash(c, band(cx - cw, cx + cw, ct, T + 2 * S), "150, 98, 58", 10, 0.22, { k: 0.2, rim: "60, 36, 24" });
          c.strokeStyle = "rgba(246, 200, 140, 0.4)";
          c.lineWidth = 1.2 * S;
          c.beginPath();
          c.moveTo(cx - cw * 0.85, ct + 1.2 * S);
          c.lineTo(cx + cw * 0.2, ct + 0.8 * S);
          c.stroke();
          return T - jh * 0.1;
        }

        function paintNear(c, W, H) {
          c.clearRect(0, 0, W, H);
          // The desk, seen from above; its far edge meets the window sill at `desk`.
          const desk = 0.86 * H;
          const top = shape([
            { x: -0.05 * W, y: desk, v: 0.04 }, { x: 0.32 * W, y: desk, v: 0.04 }, { x: 0.66 * W, y: desk, v: 0.04 },
            { x: 1.05 * W, y: desk, v: 0.04 }, { x: 1.05 * W, y: 1.3 * H, v: 0.04 }, { x: -0.05 * W, y: 1.3 * H, v: 0.04 },
          ], 0.5 * W, H);
          c.save();
          trace(c, top);
          const g = c.createLinearGradient(0, desk, 0, H);
          g.addColorStop(0, "#30231f");
          g.addColorStop(1, "#1a1216");
          c.fillStyle = g;
          c.fill();
          c.clip();
          wash(c, blob(0.28 * W, desk + 0.1 * H, 0.38 * W, 0.09 * H), "128, 76, 42", 22, 0.035, { spread: 0.1 });
          wash(c, blob(0.86 * W, desk + 0.1 * H, 0.3 * W, 0.1 * H), "26, 18, 20", 20, 0.06, { spread: 0.1 });
          // Grain, dry-brushed: a nearly dry brush dragged across leaves broken strokes,
          // which is what says wood rather than ground.
          c.lineCap = "round";
          for (let i = 0; i < 11; i++) {
            const y = desk + (0.012 + i * 0.013 + gauss() * 0.003) * H;
            for (let x = -10 * S + rand() * 60 * S; x < W; ) {
              const len = (30 + rand() * 140) * S, sag = gauss() * 1.2 * S;
              c.strokeStyle = rand() < 0.75 ? "rgba(16, 10, 10, " + (0.1 + rand() * 0.14) + ")" : "rgba(214, 150, 92, " + (0.05 + rand() * 0.06) + ")";
              c.lineWidth = (0.6 + rand() * 1.2) * S;
              c.beginPath();
              c.moveTo(x, y + gauss() * 0.5 * S);
              c.quadraticCurveTo(x + len / 2, y + sag, x + len, y + gauss() * 0.5 * S);
              c.stroke();
              x += len + (8 + rand() * 50) * S;
            }
          }
          c.restore();
          // The window's own frame at either side, which is what puts the viewer indoors.
          // The lamp, low on the left, catches the inside face of the right-hand jamb.
          for (const [x0, x1] of [[-0.03 * W, 0.028 * W], [0.972 * W, 1.03 * W]]) {
            const jamb = shape([
              { x: x0, y: -0.03 * H, v: 0.03 }, { x: x1, y: -0.03 * H, v: 0.03 }, { x: x1, y: 0.45 * H, v: 0.03 },
              { x: x1, y: desk + 2 * S, v: 0.02 }, { x: x0, y: desk + 2 * S, v: 0.02 },
            ], (x0 + x1) / 2, 0.5 * H);
            trace(c, jamb);
            c.fillStyle = "#1a1316";
            c.fill();
            wash(c, jamb, "52, 34, 28", 8, 0.12, { k: 0.15, rim: "6, 4, 8", rimAlpha: 0.2 });
          }
          const lit = c.createLinearGradient(0, desk, 0, 0.3 * H);
          lit.addColorStop(0, "rgba(236, 176, 112, 0.34)");
          lit.addColorStop(1, "rgba(236, 176, 112, 0)");
          c.strokeStyle = lit;
          c.lineWidth = 1.6 * S;
          c.beginPath();
          c.moveTo(0.972 * W, desk);
          c.lineTo(0.973 * W, 0.3 * H);
          c.stroke();
          // Shadow where the desk meets the wall, and the lamp catching the sill above it.
          trace(c, top);
          c.strokeStyle = "rgba(10, 6, 12, 0.55)";
          c.lineWidth = 2.4 * S;
          c.stroke();
          c.save();
          c.translate(0, -2.4 * S);
          trace(c, top);
          c.strokeStyle = "rgba(236, 190, 130, 0.22)";
          c.lineWidth = 1.1 * S;
          c.stroke();
          c.restore();
          const jarTop = terrarium(c, W, H, desk);
          paper(c, W, H, Math.max(0, Math.floor(Math.min(jarTop, desk - 4 * S))));
        }

        function paintFlash(c, W, H) {
          c.clearRect(0, 0, W, H);
          wash(c, blob(0.5 * W, -0.12 * H, 0.62 * W, 0.56 * H), "196, 190, 255", 26, 0.03, { spread: 0.15 });
          wash(c, blob(0.14 * W, 0.02 * H, 0.24 * W, 0.34 * H), "214, 206, 255", 18, 0.03, { spread: 0.12 });
          wash(c, blob(0.88 * W, 0.04 * H, 0.24 * W, 0.32 * H), "214, 206, 255", 18, 0.03, { spread: 0.12 });
        }

        function fit(canvas, scale) {
          const box = canvas.getBoundingClientRect();
          canvas.width = Math.max(1, Math.round(box.width * scale));
          canvas.height = Math.max(1, Math.round(box.height * scale));
          S = Math.min(canvas.width / 960, canvas.height / 620);
          return [canvas.getContext("2d"), canvas.width, canvas.height];
        }
        function paintAll() {
          // Once the visitor clicks through, the poster is detached; leave it be.
          if (!sky.isConnected) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          reseed(7);
          paintSky(...fit(sky, dpr));
          reseed(11);
          paintNear(...fit(near, dpr));
          // The flash is nothing but soft wash, so half resolution loses nothing.
          reseed(13);
          paintFlash(...fit(flash, dpr / 2));
        }
        let again = 0;
        window.addEventListener("resize", () => {
          clearTimeout(again);
          again = setTimeout(paintAll, 150);
        });
        paintAll();
      })();

      // Swap the poster for the real app only once the visitor asks for it. Same-origin,
      // so the sandbox keeps normal access to localStorage and can save scenes.
      // The whole card is clickable for convenience, while the real <button> inside it is
      // the keyboard and screen-reader target.
      function enter() {
          const poster = document.getElementById("poster");
          const frame = document.createElement("iframe");
          frame.src = "index.html";
          frame.title = "Night Desk Terrarium";
          frame.allow = "autoplay; fullscreen";
          // If the app never arrives — a deploy mid-flight, a dropped connection — put the
          // poster back rather than leaving a dead frame the visitor cannot retry from.
          const giveUp = setTimeout(() => {
            document.body.replaceChildren(poster);
            document.getElementById("hint").textContent = "That did not load — click to try again";
            document.getElementById("poster").addEventListener("click", enter, { once: true });
          }, 20000);
          frame.addEventListener("load", () => clearTimeout(giveUp), { once: true });
          document.body.replaceChildren(frame);
          frame.focus();
      }
      document.getElementById("poster").addEventListener("click", enter, { once: true });
    </script>
  </body>
</html>
