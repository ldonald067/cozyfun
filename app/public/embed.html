<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Desk Terrarium — a cozy pixel sandbox</title>
    <meta name="robots" content="noindex" />
    <!-- RELATIVE, unlike index.html: this file is copied verbatim out of public/, so
         Vite never rewrites it and a leading slash would break every subpath deploy. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" sizes="32x32" />
    <!--
      Click-to-load shell for embedding the sandbox in a page on another site.

      The point is weight. The app is ~7 MB with its ambience beds, and an embed that
      autoloads makes every visitor who scrolls past pay for it. This poster is ~80 KB
      (~24 KB compressed) and pulls in nothing until someone actually asks to play.

      Nothing here is an image file. The scene is a watercolour that the script at the
      bottom paints into canvases, once on load and again on resize: the night sky behind
      the rain, the desk and two jars in front of it, the rain's tiles, and the lightning,
      whose fractal shape is kept once as SVG paths. Condensation is CSS gradients, and
      everything that moves is a transform or an opacity. The card fetches no sub-resources at all, against roughly
      440 KB of PNGs for the CodePen the rain borrows from.

      Two things were deliberately not borrowed. That reference animates
      `background-position`, which repaints every frame instead of compositing, and its
      travel is not a whole number of tiles, so the field visibly resets each cycle. Both
      are avoided here by translating whole tiles with `transform` (see the note above
      the rain keyframes).

      Every path here is relative, so this file works unchanged at a domain root or under
      a subpath — it always sits next to the index.html it launches, whatever COZY_BASE
      was set to at build time.

      Host this on the same SITE as the page embedding it — same registrable domain, which
      a subdomain satisfies. That is the boundary browsers actually enforce: Chrome
      partitions storage by top-level site and Safari's ITP judges third-party by
      registrable domain, so pixelfun.littlealbumclub.net inside littlealbumclub.net is not
      a third party even though it is a different origin. A wholly different domain
      (itch.io, say) is, and there the sandbox loses localStorage — silently breaking saved
      terrariums, the one thing players want to keep.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #091018;
        color: #e8ecf2;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
        /* Stands in until the painting exists, and for good if the script never runs. */
        background: radial-gradient(120% 90% at 50% 12%, #222a48 0%, #171d33 55%, #0e1222 100%);
      }

      /* The painting is two canvases with the weather between them: the sky at the back,
         the desk and terrarium at the front, so rain falls outside the window and never
         across the jar. Both are painted once and left alone, so they cost nothing per
         frame; everything that moves is a transform or an opacity between or above them. */
      .paint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      /* Three sheets at different drop size, speed and opacity read as depth: the near one
         largest, brightest and fastest, the far one finest and slowest. The slant comes
         from the drift keyframe below, not from a rotation, so these sit flush in the frame.
         Each sheet starts a little more than one cycle's travel above and left of the frame:
         a sheet flush with it slid off its own top-left corner as it fell, leaving a strip
         there with no drops for that sheet for most of every cycle. */
      .rain {
        position: absolute;
        inset: -330px 0 0 -90px;
        pointer-events: none;
        background-repeat: repeat;
        will-change: transform;
      }
      /* Drops are small ovals, 1-3px, not streaks. Compositing the reference's rain PNG
         over a dark field shows its texture is speckle too — what turns those dots into
         rain is speed, not shape: they move fast enough to smear in the eye. Drawing the
         blur instead, as long thin streaks, looked like scratches; drawing large slow
         drops looked like snow.

         Each drop is a radial gradient because a one-dimensional linear-gradient cannot
         leave gaps along both axes — its band spans the whole tile width, so neighbouring
         tiles merge into unbroken stripes and the card reads as venetian blinds. The tint
         is the paper's, a touch of lavender, so the rain sits in the painting's palette. */
      .rain--far {
        background-image:
          radial-gradient(1.2px 1.8px at 22% 12%, rgba(190, 196, 232, 0.42), transparent 70%),
          radial-gradient(1px 1.5px at 68% 44%, rgba(190, 196, 232, 0.36), transparent 70%),
          radial-gradient(1.2px 1.8px at 44% 78%, rgba(190, 196, 232, 0.38), transparent 70%),
          radial-gradient(1px 1.4px at 84% 88%, rgba(190, 196, 232, 0.32), transparent 70%);
        background-size: 51px 96px;
        animation: rain-far 0.34s linear infinite;
      }
      .rain--mid {
        background-image:
          radial-gradient(1.6px 2.4px at 16% 20%, rgba(210, 214, 246, 0.50), transparent 70%),
          radial-gradient(1.4px 2px at 58% 58%, rgba(210, 214, 246, 0.42), transparent 70%),
          radial-gradient(1.5px 2.2px at 86% 34%, rgba(210, 214, 246, 0.44), transparent 70%),
          radial-gradient(1.2px 1.8px at 36% 86%, rgba(210, 214, 246, 0.38), transparent 70%);
        background-size: 66px 124px;
        animation: rain-mid 0.26s linear infinite;
      }
      .rain--near {
        background-image:
          radial-gradient(2.2px 3.2px at 30% 24%, rgba(236, 236, 252, 0.58), transparent 68%),
          radial-gradient(1.9px 2.8px at 74% 62%, rgba(236, 236, 252, 0.50), transparent 68%),
          radial-gradient(1.7px 2.4px at 52% 88%, rgba(236, 236, 252, 0.44), transparent 68%);
        background-size: 85px 158px;
        animation: rain-near 0.2s linear infinite;
      }

      /* Each layer slides exactly one tile across and two down per cycle, so the pattern
         lands back on itself and the loop has no seam. The reference animates
         background-position from 0% 0% to 20% 100% instead, which is where the slant idea
         came from — but a percentage background-position resolves to
         (container - tile) * percentage, so its travel is almost never a whole number of
         tiles. Measured in this frame that snapped the near field 146px, roughly a whole
         tile, three times a second. Whole-tile transforms also make the motion independent
         of frame size, and animate a compositor property instead of forcing a repaint.
         Ratios are chosen so all three fall at about 15 degrees. */
      @keyframes rain-far  { to { transform: translate(51px, 192px); } }
      @keyframes rain-mid  { to { transform: translate(66px, 248px); } }
      @keyframes rain-near { to { transform: translate(85px, 316px); } }

      /* Condensation clinging to the inside of the glass, in front of the falling rain so
         the two read as different distances: weather outside, window between. Each bead is
         a pale core inside a darker ring, the way a drop of water dropped into a drying wash
         pushes pigment out to its edge. Beads do not move — they cling — so this layer is
         static and costs nothing to run. */
      .glass {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .glass--a {
        background-image:
          radial-gradient(circle 3px at 12% 18%, rgba(236, 234, 252, 0.34), rgba(236, 234, 252, 0.12) 52%, rgba(16, 18, 40, 0.34) 70%, transparent 80%),
          radial-gradient(circle 5px at 63% 34%, rgba(236, 234, 252, 0.30), rgba(236, 234, 252, 0.10) 52%, rgba(16, 18, 40, 0.32) 70%, transparent 80%),
          radial-gradient(circle 2px at 84% 11%, rgba(236, 234, 252, 0.36), rgba(16, 18, 40, 0.26) 66%, transparent 80%),
          radial-gradient(circle 4px at 37% 71%, rgba(236, 234, 252, 0.28), rgba(236, 234, 252, 0.09) 52%, rgba(16, 18, 40, 0.30) 70%, transparent 80%),
          radial-gradient(circle 2px at 78% 84%, rgba(236, 234, 252, 0.30), rgba(16, 18, 40, 0.24) 66%, transparent 80%),
          radial-gradient(circle 3px at 20% 92%, rgba(236, 234, 252, 0.26), rgba(16, 18, 40, 0.24) 68%, transparent 80%);
        background-size: 184px 202px;
      }
      .glass--b {
        background-image:
          radial-gradient(circle 2px at 45% 8%, rgba(236, 234, 252, 0.28), rgba(16, 18, 40, 0.22) 66%, transparent 80%),
          radial-gradient(circle 4px at 88% 48%, rgba(236, 234, 252, 0.28), rgba(236, 234, 252, 0.08) 52%, rgba(16, 18, 40, 0.28) 70%, transparent 80%),
          radial-gradient(circle 2px at 8% 62%, rgba(236, 234, 252, 0.24), rgba(16, 18, 40, 0.20) 66%, transparent 80%),
          radial-gradient(circle 3px at 58% 88%, rgba(236, 234, 252, 0.24), rgba(16, 18, 40, 0.22) 68%, transparent 80%);
        background-size: 137px 151px;
        background-position: 40px 25px;
      }

      /* A few beads let go and run down the glass the way drops do: they cling and creep,
         slip, catch on another bead, then run to the sill, where the desk hides them. The
         trail rides with the head. Four drips on long, unrelated cycles never line up. */
      .drip {
        position: absolute;
        width: 8px;
        height: 54px;
        opacity: 0;
        pointer-events: none;
        background:
          radial-gradient(circle 3.5px at 50% calc(100% - 4px), rgba(244, 242, 255, 0.62), rgba(244, 242, 255, 0.2) 55%, rgba(16, 18, 40, 0.5) 72%, transparent 84%) no-repeat,
          linear-gradient(to bottom, transparent, rgba(226, 230, 250, 0.14) 60%, rgba(226, 230, 250, 0.26) 90%, transparent) 50% 0 / 2px 92% no-repeat;
        animation: drip 16s cubic-bezier(0.5, 0, 0.9, 0.6) infinite;
      }
      .drip--1 { left: 9%;  top: 4%;  --fall: 76vh; animation-duration: 17s; animation-delay: -2s; }
      .drip--2 { left: 31%; top: 14%; --fall: 66vh; animation-duration: 23s; animation-delay: -15s; }
      .drip--3 { left: 61%; top: 2%;  --fall: 78vh; animation-duration: 19s; animation-delay: -9s; }
      .drip--4 { left: 92%; top: 20%; --fall: 60vh; animation-duration: 29s; animation-delay: -21s; }
      @keyframes drip {
        0%        { transform: translateY(0); opacity: 0; }
        5%        { opacity: 1; }
        34%       { transform: translateY(calc(var(--fall) * 0.06)); }
        46%       { transform: translateY(calc(var(--fall) * 0.42)); }
        58%       { transform: translateY(calc(var(--fall) * 0.47)); }
        70%       { transform: translateY(var(--fall)); opacity: 1; }
        74%, 100% { transform: translateY(var(--fall)); opacity: 0; }
      }

      /* A gradient cannot make a fork, so the bolt's shape is a fractal: its 44 branches
         were generated by a seeded walk rather than drawn by hand — the reference bolt is
         dozens of hairlines forking recursively, which is not something to author by hand.
         The paths are kept once, in .geometry, and the script paints each placement from
         them (see paintBolts). */
      .geometry { position: absolute; width: 0; height: 0; }
      .bolt {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      /* One bolt, placed three times at different scales and angles — the reference does
         exactly this with three copies of a single image. Each is painted with its own
         seed, so the three are different paintings of one bolt. */
      .bolt--1 { top: -6%; left: 4%;  height: clamp(150px, 62%, 380px); transform: rotate(-4deg); animation: strike 13s ease-out infinite; }
      .bolt--2 { top: -10%; left: 34%; height: clamp(110px, 46%, 280px); transform: rotate(9deg) scaleX(-1); animation: strike 13s ease-out 4.2s infinite; }
      .bolt--3 { top: -4%; right: 2%; height: clamp(130px, 54%, 330px); transform: rotate(6deg); animation: strike 13s ease-out 8.6s infinite; }

      /* A real strike is over in a blink and usually flickers twice. Most of the 13s cycle
         is dark, so it stays weather rather than a strobe. */
      @keyframes strike {
        0%, 5.5%, 100% { opacity: 0; }
        0.6%           { opacity: 1; }
        1.6%           { opacity: 0.12; }
        2.8%           { opacity: 0.8; }
        4.4%           { opacity: 0; }
      }

      /* The sky lifting behind the bolt — what actually sells it as distance. It is a
         painted wash rather than a gradient, so it blooms with ragged edges like the rest of
         the sky. One canvas carries every strike, so it flickers at each bolt's delay
         (4.2s and 8.6s of 13s): a single un-staggered flash once lit only the first strike
         and left the other two firing into an unlit sky. */
      .flash {
        opacity: 0;
        animation: storm 13s ease-out infinite;
      }
      @keyframes storm {
        0%, 5.5%, 32.3%, 37.8%, 66.2%, 71.7%, 100% { opacity: 0; }
        0.7%  { opacity: 0.55; }
        1.8%  { opacity: 0.08; }
        3%    { opacity: 0.4; }
        4.6%  { opacity: 0; }
        33%   { opacity: 0.55; }
        34.1% { opacity: 0.08; }
        35.3% { opacity: 0.4; }
        36.9% { opacity: 0; }
        66.9% { opacity: 0.55; }
        68%   { opacity: 0.08; }
        69.2% { opacity: 0.4; }
        70.8% { opacity: 0; }
      }

      /* The jars' own layers, placed by the script over the desk. Everything in them
         that moves is a transform or an opacity. What grows sways a little from the soil
         line, the two jars out of step; the creatures ride along with it. */
      .jar { position: absolute; pointer-events: none; }
      .jar-life, .jar-glass, .jar-sway, .jar-critters { position: absolute; inset: 0; width: 100%; height: 100%; }
      .jar-sway { animation: sway 9s ease-in-out infinite; }
      .jar--bugs .jar-sway { animation-duration: 11s; animation-delay: -5s; }
      @keyframes sway {
        0%, 100% { transform: skewX(-0.7deg); }
        50%      { transform: skewX(0.7deg); }
      }
      .critter { position: absolute; }
      .glint { position: absolute; border-radius: 50%; }

      /* A ladybug works up the twig in fits and starts, turns, and comes back down. */
      .ladybug { animation: crawl 26s ease-in-out infinite; }
      @keyframes crawl {
        0%, 6%   { transform: translate(0, 0) rotate(var(--rot)); }
        18%, 25% { transform: translate(calc(var(--dx) * 0.35), calc(var(--dy) * 0.35)) rotate(var(--rot)); }
        42%      { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
        48%, 54% { transform: translate(var(--dx), var(--dy)) rotate(calc(var(--rot) + 180deg)); }
        74%, 80% { transform: translate(calc(var(--dx) * 0.45), calc(var(--dy) * 0.45)) rotate(calc(var(--rot) + 180deg)); }
        94%      { transform: translate(0, 0) rotate(calc(var(--rot) + 180deg)); }
        100%     { transform: translate(0, 0) rotate(calc(var(--rot) + 360deg)); }
      }
      /* A butterfly at rest opens and closes its wings now and then. */
      .butterfly { animation: flap 6.5s ease-in-out infinite; }
      @keyframes flap {
        0%, 56%, 100% { transform: scaleX(1); }
        60%, 68%, 76% { transform: scaleX(0.2); }
        64%, 72%      { transform: scaleX(1); }
      }
      /* A snail crosses the loam over a minute and a half, then is gone and comes again. */
      .snail { animation: creep 90s linear infinite; }
      .snail--west { --face: -1; }
      @keyframes creep {
        0%        { transform: translateX(0) scaleX(var(--face, 1)); opacity: 0; }
        6%        { opacity: 1; }
        88%       { transform: translateX(var(--dx)) scaleX(var(--face, 1)); opacity: 1; }
        96%, 100% { transform: translateX(var(--dx)) scaleX(var(--face, 1)); opacity: 0; }
      }
      /* A spider on a thread: the thread stretches from the lid while the spider rides
         its end, on the same clock and easing, so the two stay joined. */
      .thread {
        position: absolute;
        width: 1px;
        background: rgba(226, 230, 246, 0.4);
        transform-origin: top;
        animation: let-out 14s ease-in-out infinite;
      }
      .spider { animation: lower 14s ease-in-out infinite; }
      @keyframes let-out {
        0%, 100% { transform: scaleY(0.25); }
        45%, 62% { transform: scaleY(1); }
      }
      @keyframes lower {
        0%, 100% { transform: translateY(calc(var(--drop) * 0.25)); }
        45%, 62% { transform: translateY(var(--drop)); }
      }
      /* A bee works round the sunflower: a slow loop, and a quick bob on top of it. */
      .flight { position: absolute; left: 0; top: 0; animation: hover 7s ease-in-out infinite; }
      .bee { animation: buzz 0.16s ease-in-out infinite; }
      @keyframes hover {
        0%, 100% { transform: translate(0, 0); }
        20%      { transform: translate(calc(var(--u) * 14px), calc(var(--u) * -6px)); }
        40%      { transform: translate(calc(var(--u) * 8px), calc(var(--u) * 6px)); }
        60%      { transform: translate(calc(var(--u) * -8px), calc(var(--u) * -2px)); }
        80%      { transform: translate(calc(var(--u) * -2px), calc(var(--u) * -10px)); }
      }
      @keyframes buzz {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(calc(var(--u) * -1px)); }
      }
      /* Fireflies drift on long loops and blink on short ones, each on its own clock. */
      .firefly {
        width: calc(var(--u) * 14px);
        height: calc(var(--u) * 14px);
        margin: calc(var(--u) * -7px) 0 0 calc(var(--u) * -7px);
        background: radial-gradient(circle, rgba(250, 255, 196, 0.95) 0 9%, rgba(214, 255, 130, 0.45) 24%, rgba(200, 255, 120, 0) 70%);
        animation-name: wander, blink;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
      @keyframes wander {
        0%, 100% { transform: translate(0, 0); }
        25%      { transform: translate(calc(var(--u) * 9px), calc(var(--u) * -6px)); }
        50%      { transform: translate(calc(var(--u) * 3px), calc(var(--u) * -14px)); }
        75%      { transform: translate(calc(var(--u) * -8px), calc(var(--u) * -5px)); }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.12; }
        40%, 60% { opacity: 1; }
      }
      /* Pollen lifts off the flower heads and drifts up through the still air. */
      .mote {
        width: calc(var(--u) * 6px);
        height: calc(var(--u) * 6px);
        margin: calc(var(--u) * -3px) 0 0 calc(var(--u) * -3px);
        background: radial-gradient(circle, rgba(255, 228, 150, 0.95) 0 18%, rgba(255, 228, 150, 0) 70%);
        opacity: 0;
        animation: rise 10s ease-in-out infinite;
      }
      @keyframes rise {
        0%   { transform: translate(0, 0); opacity: 0; }
        15%  { opacity: 0.9; }
        50%  { transform: translate(calc(var(--u) * 5px), calc(var(--u) * -22px)); }
        85%  { opacity: 0.6; }
        100% { transform: translate(calc(var(--u) * -3px), calc(var(--u) * -44px)); opacity: 0; }
      }
      /* The moonlit flower breathes its light in and out. */
      .moonglow {
        width: calc(var(--u) * 70px);
        height: calc(var(--u) * 70px);
        margin: calc(var(--u) * -35px) 0 0 calc(var(--u) * -35px);
        background: radial-gradient(circle, rgba(170, 186, 255, 0.4), rgba(140, 160, 255, 0.12) 40%, rgba(140, 160, 255, 0) 70%);
        animation: breathe 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.3; transform: scale(0.88); }
        50%      { opacity: 1; transform: scale(1.06); }
      }

      /* Keeps the rain, and a strike, from crawling over the type. */
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(46% 40% at 50% 48%, rgba(12, 14, 30, 0.66), transparent 75%);
      }
      /* On a phone the text block is nearly the frame's width, and a scrim sized for a wide
         frame left a strike behind the paragraph at 3:1. (A max() floor on the gradient's
         size would say this in one rule, but Chrome rejects math in a gradient size and
         drops the whole scrim.) */
      @media (max-width: 560px) {
        .scrim { background: radial-gradient(78% 36% at 50% 48%, rgba(12, 14, 30, 0.74), transparent 78%); }
      }

      .content {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: clamp(1.25rem, 5vw, 3rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font: 600 clamp(1.35rem, 3.4vw, 2rem)/1.2 Georgia, "Iowan Old Style", serif;
        color: #f4dfb8;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 18px rgba(10, 12, 26, 0.9);
      }
      p {
        margin: 0;
        max-width: 46ch;
        color: #b4c2d6;
        font-size: clamp(0.9rem, 1.6vw, 1rem);
        text-shadow: 0 1px 12px rgba(10, 12, 26, 0.85);
      }
      .play {
        margin-top: 0.4rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid rgba(244, 223, 184, 0.42);
        border-radius: 999px;
        background: rgba(244, 223, 184, 0.1);
        color: #f4dfb8;
        font: 600 1rem/1 inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        backdrop-filter: blur(2px);
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }
      .poster:hover .play,
      .play:focus-visible {
        background: rgba(244, 223, 184, 0.19);
        border-color: rgba(244, 223, 184, 0.75);
        transform: translateY(-1px);
      }
      .play:focus-visible { outline: 2px solid #f4dfb8; outline-offset: 3px; }
      .hint { font-size: 0.78rem; color: #8b9bb4; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }

      /* Motion is decoration here, so drop it entirely when it is unwelcome — the rain
         stays as a still texture rather than disappearing. */
      @media (prefers-reduced-motion: reduce) {
        .rain { animation: none; }
        /* The beads are static anyway; the storm and the drips are pure motion, so they
           go entirely. */
        .flash, .bolt { animation: none; opacity: 0; }
        .drip { animation: none; display: none; }
        /* The jars hold still; their creatures stay where they were painted. */
        .jar *, .jar-sway { animation: none !important; }
        .snail { transform: scaleX(var(--face, 1)); }
        .ladybug { transform: rotate(var(--rot)); }
        .thread { transform: scaleY(0.6); }
        .spider { transform: translateY(calc(var(--drop) * 0.6)); }
        .play { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="poster" id="poster">
      <canvas class="paint" id="sky" aria-hidden="true"></canvas>
      <canvas class="paint flash" id="flash" aria-hidden="true"></canvas>

      <div class="content">
        <h1>Night Desk Terrarium</h1>
        <p>
          A cozy pixel sandbox. Pour sand and water, light a hearth, grow moss and
          moonlit flowers — no score, no timer, nothing to win.
        </p>
        <button class="play" id="play" type="button">Enter the terrarium</button>
        <span class="hint" id="hint">Loads on click · sound is off until you turn it on</span>
      </div>
    </div>

    <script>
      // The watercolour. Painted here once, and again only when the frame changes size;
      // nothing in the canvases moves, so after load they cost nothing per frame.
      //
      // Washes follow Tyler Hobbs' layered-polygon method: a rough blob is frayed by
      // recursive midpoint displacement, then filled a few dozen times at a few percent
      // opacity, each fill frayed afresh. The overlap builds a dense middle that thins out
      // through a ragged, uneven edge, which is what pigment does as a wash dries. A seeded
      // generator paints the same picture on every load and every resize.
      (function () {
        const sky = document.getElementById("sky");
        const near = document.getElementById("near");
        const flash = document.getElementById("flash");
        if (!sky.getContext) return;
        // S is the painting's scale against its 960x620 design frame, in canvas pixels.
        let rand, S;

        function reseed(a) {
          rand = function () {
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function gauss() {
          let u = 0;
          while (!u) u = rand();
          return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * rand());
        }

        // Every edge gains a vertex pushed off its midpoint by an amount proportional to
        // the edge's length, so long edges wander and short ones fray. `v` is each vertex's
        // own roughness, inherited with a little drift, so one blob has both crisp and
        // feathered stretches of edge, as a real wash does.
        function deform(pts, times, k) {
          for (let d = 0; d < times; d++) {
            const out = [];
            for (let i = 0; i < pts.length; i++) {
              const a = pts[i], b = pts[(i + 1) % pts.length];
              const v = ((a.v + b.v) / 2) * (0.8 + rand() * 0.4);
              const sd = Math.hypot(b.x - a.x, b.y - a.y) * v * k;
              out.push(a, { x: (a.x + b.x) / 2 + gauss() * sd, y: (a.y + b.y) / 2 + gauss() * sd, v });
            }
            pts = out;
          }
          return pts;
        }
        function shape(pts, cx, cy) {
          const p = deform(pts, 2, 0.35);
          p.cx = cx;
          p.cy = cy;
          return p;
        }
        function blob(cx, cy, rx, ry, rough) {
          const pts = [];
          for (let i = 0; i < 10; i++) {
            const a = (i / 10) * 6.2832;
            pts.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, v: (0.3 + rand() * 0.6) * (rough || 1) });
          }
          return shape(pts, cx, cy);
        }
        // A band across the jar, flat-bottomed, with a slightly wandering top.
        function band(x0, x1, y0, y1) {
          const pts = [
            { x: x0, y: y0, v: 0.12 }, { x: (x0 + x1) / 2, y: y0 - 2 * S, v: 0.12 }, { x: x1, y: y0, v: 0.12 },
            { x: x1, y: y1, v: 0.04 }, { x: x0, y: y1, v: 0.04 },
          ];
          return shape(pts, (x0 + x1) / 2, (y0 + y1) / 2);
        }
        function trace(c, p) {
          c.beginPath();
          c.moveTo(p[0].x, p[0].y);
          for (let i = 1; i < p.length; i++) c.lineTo(p[i].x, p[i].y);
          c.closePath();
        }
        // One wash. `spread` scales each layer about the blob's centre, which is what
        // spreads a wet-into-wet edge over a wide soft band; `rim` strokes every layer
        // faintly in a darker colour, and the strokes pile up into the dark tide line a
        // wash leaves where it dried.
        function wash(c, base, rgb, layers, alpha, o) {
          o = o || {};
          c.fillStyle = "rgba(" + rgb + "," + alpha + ")";
          if (o.rim) {
            c.strokeStyle = "rgba(" + o.rim + "," + (o.rimAlpha || alpha * 1.6) + ")";
            c.lineWidth = 1.3 * S;
          }
          for (let i = 0; i < layers; i++) {
            const s = 1 + gauss() * (o.spread || 0.03);
            const layer = base.map((q) => ({ x: base.cx + (q.x - base.cx) * s, y: base.cy + (q.y - base.cy) * s, v: q.v }));
            trace(c, deform(layer, 3, o.k || 0.35));
            c.fill();
            if (o.rim) c.stroke();
          }
        }
        // Flicked off a loaded brush: mostly pale, a few dark.
        function spatter(c, W, H, n) {
          for (let i = 0; i < n; i++) {
            const light = rand() < 0.75;
            c.fillStyle = light
              ? "rgba(232, 230, 250, " + (0.05 + rand() * 0.2) + ")"
              : "rgba(8, 10, 24, " + (0.18 + rand() * 0.25) + ")";
            c.beginPath();
            c.arc(rand() * W, rand() * H, (0.35 + Math.pow(rand(), 3) * 2) * S, 0, 6.2832);
            c.fill();
          }
        }
        // Paper: a fine tooth plus slow blotches, multiplied in. Stronger in the darks,
        // because heavy pigment settles into the paper's hollows (granulation) while thin
        // washes lie clear. Rows above `top` are left alone, and so are empty pixels.
        function paper(c, W, H, top) {
          if (top >= H) return;
          const img = c.getImageData(0, top, W, H - top), d = img.data;
          // Two tooth octaves at unrelated sizes, so neither one's lattice shows.
          const cell = Math.max(2, 3.7 * S), fine = Math.max(1.3, 1.6 * S), big = 120 * S;
          const tw = Math.ceil(W / cell) + 2, fw = Math.ceil(W / fine) + 2, bw = Math.ceil(W / big) + 2;
          const tooth = new Float32Array(tw * (Math.ceil(H / cell) + 2)).map(rand);
          const grit = new Float32Array(fw * (Math.ceil(H / fine) + 2)).map(rand);
          const blots = new Float32Array(bw * (Math.ceil(H / big) + 2)).map(rand);
          function lerp(g, w, x, y) {
            const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * w + xi;
            return (g[i] * (1 - fx) + g[i + 1] * fx) * (1 - fy) + (g[i + w] * (1 - fx) + g[i + w + 1] * fx) * fy;
          }
          for (let y = top, o = 0; y < H; y++) {
            for (let x = 0; x < W; x++, o += 4) {
              if (!d[o + 3]) continue;
              const lum = (d[o] * 0.3 + d[o + 1] * 0.59 + d[o + 2] * 0.11) / 255;
              const t = lerp(tooth, tw, x / cell, y / cell) * 0.45 + lerp(grit, fw, x / fine, y / fine) * 0.35 + rand() * 0.2 - 0.5;
              const f = 1 + t * (0.22 + 0.26 * (1 - lum)) + (lerp(blots, bw, x / big, y / big) - 0.5) * 0.14;
              d[o] *= f;
              d[o + 1] *= f;
              d[o + 2] *= f;
            }
          }
          c.putImageData(img, 0, top);
        }

        function paintSky(c, W, H) {
          const g = c.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, "#151a30");
          g.addColorStop(0.45, "#212a4a");
          g.addColorStop(1, "#2b2846");
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
          // Wet into wet: big overlapping washes of Payne's grey, ultramarine, violet and a
          // little turquoise, each dropped into the last before it dried, so they bleed far
          // into one another and none has an edge to speak of. Two small charges of deep
          // indigo and rose were dropped in last.
          const wet = { spread: 0.2, k: 0.42 };
          wash(c, blob(0.5 * W, -0.08 * H, 0.8 * W, 0.34 * H), "10, 12, 26", 36, 0.035, wet);
          wash(c, blob(0.22 * W, 0.34 * H, 0.34 * W, 0.26 * H), "44, 60, 128", 30, 0.028, wet);
          wash(c, blob(0.8 * W, 0.24 * H, 0.3 * W, 0.22 * H), "40, 54, 120", 28, 0.028, wet);
          wash(c, blob(0.56 * W, 0.52 * H, 0.32 * W, 0.22 * H), "76, 54, 122", 30, 0.026, wet);
          wash(c, blob(0.96 * W, 0.66 * H, 0.2 * W, 0.26 * H), "82, 56, 118", 24, 0.026, wet);
          wash(c, blob(0.06 * W, 0.62 * H, 0.2 * W, 0.24 * H), "30, 84, 104", 24, 0.028, wet);
          wash(c, blob(0.34 * W, 0.2 * H, 0.16 * W, 0.12 * H), "18, 22, 64", 20, 0.04, wet);
          wash(c, blob(0.76 * W, 0.46 * H, 0.14 * W, 0.12 * H), "130, 64, 104", 20, 0.03, wet);
          // A band of cloud lifted out with a damp brush.
          wash(c, blob(0.42 * W, 0.15 * H, 0.36 * W, 0.07 * H), "120, 128, 184", 24, 0.016, { spread: 0.16 });
          // The frame's dark paint touched the sky while it was wet and bled into it.
          wash(c, blob(0, 0.45 * H, 0.05 * W, 0.6 * H), "40, 24, 24", 14, 0.05, { spread: 0.25 });
          wash(c, blob(W, 0.45 * H, 0.05 * W, 0.6 * H), "40, 24, 24", 14, 0.05, { spread: 0.25 });
          // Lamplight on the glass, low and to the left: it lightens what is there rather
          // than covering it, so it goes on as screen.
          c.globalCompositeOperation = "screen";
          wash(c, blob(0.28 * W, 1.0 * H, 0.42 * W, 0.26 * H), "150, 82, 36", 18, 0.022, { spread: 0.14 });
          wash(c, blob(0.28 * W, 0.97 * H, 0.2 * W, 0.12 * H), "210, 140, 70", 14, 0.024, { spread: 0.14 });
          // Backruns: where wet paint crept back into a drying wash, leaving a pale
          // cauliflower inside a dark, frilled tide line.
          for (const [x, y, r] of [[0.15, 0.24, 0.075], [0.86, 0.13, 0.055], [0.66, 0.36, 0.04]]) {
            const b = blob(x * W, y * H, r * W, r * W * 0.75, 1.5);
            c.globalCompositeOperation = "screen";
            wash(c, b, "70, 80, 140", 4, 0.035, { k: 0.18 });
            c.globalCompositeOperation = "source-over";
            wash(c, b, "0, 0, 0", 3, 0, { k: 0.5, rim: "6, 8, 22", rimAlpha: 0.14 });
          }
          c.globalCompositeOperation = "source-over";
          // Runs: the board was tipped while the sky was still wet, and paint crept down in
          // threads that each end in a bead. Kept off the middle, where the type sits.
          c.lineCap = "round";
          for (let i = 0; i < 10; i++) {
            const dark = i < 6;
            let x = (rand() < 0.5 ? 0.05 + rand() * 0.2 : 0.75 + rand() * 0.2) * W;
            const y = (dark ? 0.1 + rand() * 0.18 : 0.3 + rand() * 0.3) * H;
            const len = (30 + rand() * 110) * S, w = (0.7 + rand() * 1.3) * S;
            const a = dark ? 0.16 + rand() * 0.14 : 0.06 + rand() * 0.06;
            c.strokeStyle = c.fillStyle = dark ? "rgba(10, 12, 34, " + a + ")" : "rgba(170, 178, 230, " + a + ")";
            c.lineWidth = w;
            c.beginPath();
            c.moveTo(x, y);
            for (let d = 6 * S; d < len; d += 6 * S) {
              x += gauss() * 0.5 * S;
              c.lineTo(x, y + d);
            }
            c.stroke();
            c.beginPath();
            c.arc(x, y + len, w * 1.4, 0, 6.2832);
            c.fill();
          }
          spatter(c, W, 0.86 * H, 110);
          paper(c, W, H, 0);
        }

        // The jars. Each is painted on three surfaces: its back (the shadow it throws, the
        // glass's tint, its strata) into the near canvas with the desk; what lives in it
        // into a canvas of its own, which sways very slightly from the soil line; and its
        // glass, lid and condensation into a third in front. The creatures that move sit
        // between the last two, as small painted canvases or points of light that CSS
        // animates, so after the one paint a jar too costs nothing but compositing.
        //
        // A jar keeps a floor on its size, so on a tall phone frame it stays a jar rather
        // than a speck; everywhere wider it is simply the frame's scale.
        function jarShape(kind, W, H, desk, side) {
          const flower = kind === "flower";
          const jw = (flower ? 146 : 156) * S, jh = (flower ? 200 : 172) * S;
          const off = Math.max(jw * 0.85, 0.17 * W), cx = side > 0 ? W - off : off, base = desk + 0.045 * H;
          // Which way the lamp (low, at 0.28 of the width) lies from the jar.
          const lamp = 0.28 * W < cx ? -1 : 1;
          return {
            jw, jh, cx, base, lamp, L: cx - jw / 2, R: cx + jw / 2, T: base - jh,
            r: jw * (flower ? 0.2 : 0.16), neck: jw * (flower ? 0.3 : 0.38), nh: jh * (flower ? 0.07 : 0.06),
            sh: jh * (flower ? 0.18 : 0.14), soil: base - jh * (flower ? 0.27 : 0.26), lid: jh * (flower ? 0.075 : 0.06),
            // Mirror an x so that whatever is drawn "on the lamp's side" is.
            m: (x) => (lamp < 0 ? x : 2 * cx - x),
          };
        }
        function outline(c, g) {
          const { L, R, T, base, cx, r, neck, nh, sh } = g;
          c.beginPath();
          c.moveTo(L + r, base);
          c.lineTo(R - r, base);
          c.quadraticCurveTo(R, base, R, base - r);
          c.lineTo(R, T + nh + sh);
          c.quadraticCurveTo(R, T + nh, cx + neck, T + nh);
          c.lineTo(cx + neck, T);
          c.lineTo(cx - neck, T);
          c.lineTo(cx - neck, T + nh);
          c.quadraticCurveTo(L, T + nh, L, T + nh + sh);
          c.lineTo(L, base - r);
          c.quadraticCurveTo(L, base, L + r, base);
          c.closePath();
        }
        // The jar's own layers, created once and refitted on every paint. Each canvas
        // shares the near canvas's pixel grid, offset to the jar's box.
        function surfaces(kind, g, px) {
          const poster = document.getElementById("poster");
          let box = poster.querySelector(".jar--" + kind);
          if (!box) {
            box = document.createElement("div");
            box.className = "jar jar--" + kind;
            box.setAttribute("aria-hidden", "true");
            box.innerHTML = '<div class="jar-sway"><canvas class="jar-life"></canvas><div class="jar-critters"></div></div><canvas class="jar-glass"></canvas>';
            poster.insertBefore(box, poster.querySelector(".scrim"));
          }
          const x0 = Math.floor(g.L - 10 * S), y0 = Math.floor(g.T - g.lid - 8 * S);
          const x1 = Math.ceil(g.R + 10 * S), y1 = Math.ceil(g.base + 6 * S);
          Object.assign(box.style, { left: x0 / px + "px", top: y0 / px + "px", width: (x1 - x0) / px + "px", height: (y1 - y0) / px + "px" });
          // --u is CSS pixels per design unit, so the creatures' motion scales with the jar.
          box.style.setProperty("--u", S / px);
          box.firstChild.style.transformOrigin = "50% " + ((g.soil - y0) / (y1 - y0)) * 100 + "%";
          // By name: after the first paint the creatures are canvases in here too.
          const [life, glass] = [box.querySelector(".jar-life"), box.querySelector(".jar-glass")].map((canvas) => {
            canvas.width = x1 - x0;
            canvas.height = y1 - y0;
            const c = canvas.getContext("2d");
            c.setTransform(1, 0, 0, 1, -x0, -y0);
            return c;
          });
          const critters = box.querySelector(".jar-critters");
          critters.replaceChildren();
          return { life, glass, critters, px, w: x1 - x0, h: y1 - y0, at: (x, y) => [(x - x0) / px, (y - y0) / px] };
        }
        // A creature that moves: painted once, centred, into its own little canvas, which
        // is placed with its centre on (x, y) and given a class that animates it. `wrap`
        // puts it inside a span, so it can carry two motions at once; `zoom` paints it
        // larger than its design size.
        function critter(s, x, y, w, h, cls, paint, vars, wrap, zoom) {
          zoom = zoom || 1;
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(w * S * zoom);
          canvas.height = Math.ceil(h * S * zoom);
          const c = canvas.getContext("2d");
          c.translate(canvas.width / 2, canvas.height / 2);
          c.scale(zoom, zoom);
          paint(c);
          const [cx, cy] = s.at(x, y), cw = canvas.width / s.px, ch = canvas.height / s.px;
          canvas.className = "critter " + cls;
          Object.assign(canvas.style, { left: cx - cw / 2 + "px", top: cy - ch / 2 + "px", width: cw + "px", height: ch + "px" });
          for (const k in vars || {}) canvas.style.setProperty(k, vars[k]);
          if (wrap) {
            const span = document.createElement("span");
            span.className = wrap;
            span.append(canvas);
            s.critters.append(span);
          } else s.critters.append(canvas);
        }
        // A point of light (a firefly, a mote, a glow): light, not pigment, so it is the
        // one kind of thing here drawn smooth. Its size and motion live in CSS.
        function glint(s, x, y, cls, duration, delay) {
          const span = document.createElement("span");
          const [cx, cy] = s.at(x, y);
          span.className = "glint " + cls;
          Object.assign(span.style, { left: cx + "px", top: cy + "px" });
          if (duration) span.style.animationDuration = duration;
          if (delay) span.style.animationDelay = delay;
          s.critters.append(span);
        }

        // The brush kit for what lives in a jar.
        // One dab of the brush, its base at (x, y), pointing along `angle`.
        function leaf(c, x, y, angle, len, wid, rgb, rim) {
          c.save();
          c.translate(x, y);
          c.rotate(angle);
          wash(c, blob(len / 2, 0, len / 2, wid / 2), rgb, 5, 0.26, { k: 0.25, rim, rimAlpha: 0.14 });
          c.restore();
        }
        // A stem is a quadratic from root to tip, laid twice, loosely. It returns a
        // function giving a point along it and its heading there, to hang leaves from.
        function stem(c, x0, y0, bx, by, x1, y1, w, rgb) {
          for (let i = 0; i < 2; i++) {
            c.beginPath();
            c.moveTo(x0 + gauss() * 0.4 * S, y0);
            c.quadraticCurveTo(bx, by, x1 + gauss() * 0.4 * S, y1);
            c.strokeStyle = "rgba(" + rgb + ", 0.5)";
            c.lineWidth = w * S;
            c.stroke();
          }
          return (t) => {
            const u = 1 - t;
            return {
              x: u * u * x0 + 2 * u * t * bx + t * t * x1,
              y: u * u * y0 + 2 * u * t * by + t * t * y1,

        // The flower jar: the sandbox's own strata, and a garden.

        }

        function glassFront(c, g, kind) {
          const { L, R, T, base, cx, jw, jh, nh, sh, r, neck, soil, lid, m } = g;
          c.save();
          outline(c, g);
          c.clip();
          // The lamp warms the near side of the glass; the far side falls into shadow.
          const warm = c.createLinearGradient(m(L), 0, cx, 0);
          warm.addColorStop(0, "rgba(240, 180, 110, 0.16)");
          warm.addColorStop(1, "rgba(240, 180, 110, 0)");
          c.globalCompositeOperation = "screen";
          c.fillStyle = warm;
          c.fillRect(L, T, jw, jh);
          c.globalCompositeOperation = "source-over";
          c.strokeStyle = "rgba(8, 10, 22, 0.28)";
          c.lineWidth = 7 * S;
          c.beginPath();
          c.moveTo(m(R), T + nh + sh * 0.6);
          c.lineTo(m(R), base);
          c.stroke();
          // A sealed jar has its own weather: condensation beaded on the inside of the
          // glass, each bead a pale core in a darker ring, as on the window.
          c.lineWidth = 0.5 * S;
          for (let i = 0; i < 20; i++) {
            const x = L + jw * (0.06 + rand() * 0.88), y = T + nh + sh * 0.4 + rand() * (soil - 0.3 * jh - T - nh);
            c.beginPath();
            c.arc(x, y, (0.6 + Math.pow(rand(), 2) * 1.6) * S, 0, 6.2832);
            c.fillStyle = "rgba(236, 240, 255, 0.26)";
            c.fill();
            c.strokeStyle = "rgba(10, 14, 30, 0.34)";
            c.stroke();
          }
          c.restore();

          // The glass itself, drawn loosely: three outlines, each slightly off register
          // and broken where the brush lifted, and a highlight lifted down the lamp side.
          c.lineCap = "round";
          for (let i = 0; i < 3; i++) {
            c.save();
            c.translate(gauss() * 0.9 * S, gauss() * 0.7 * S);
            c.setLineDash([(30 + rand() * 50) * S, (2 + rand() * 6) * S, (10 + rand() * 30) * S, (1 + rand() * 4) * S]);
            c.lineDashOffset = rand() * 100 * S;
            c.strokeStyle = "rgba(214, 226, 246, " + (0.12 + rand() * 0.12) + ")";
            c.lineWidth = (0.9 + rand() * 1.2) * S;
            outline(c, g);
            c.stroke();
            c.restore();
          }
          c.strokeStyle = "rgba(255, 240, 214, 0.42)";
          c.lineWidth = 2.6 * S;
          c.beginPath();
          c.moveTo(m(L + 0.12 * jw), T + nh + sh * 0.9);
          c.quadraticCurveTo(m(L + 0.07 * jw), base - jh * 0.45, m(L + 0.1 * jw), base - r * 1.2);
          c.stroke();
          c.lineWidth = 1.6 * S;
          c.beginPath();
          c.moveTo(m(L + 0.24 * jw), T + nh + sh * 0.35);
          c.lineTo(m(L + 0.3 * jw), T + nh + sh * 0.2);
          c.stroke();
          if (kind === "flower") {
            // A cork, with the lamp catching its top.
            const cw = neck * 1.1, ct = T - lid;
            wash(c, band(cx - cw, cx + cw, ct, T + 2 * S), "150, 98, 58", 10, 0.22, { k: 0.2, rim: "60, 36, 24" });
            c.strokeStyle = "rgba(246, 200, 140, 0.4)";
            c.lineWidth = 1.2 * S;
            c.beginPath();
            c.moveTo(m(cx - cw * 0.85), ct + 1.2 * S);
            c.lineTo(m(cx + cw * 0.2), ct + 0.8 * S);
            c.stroke();
          } else {
            // A tin lid, seen a little from above, punched with air holes.
            const lw = neck * 1.16, lt = T - lid;
            wash(c, band(cx - lw, cx + lw, lt, T + 2 * S), "128, 130, 144", 10, 0.24, { k: 0.2, rim: "46, 48, 58" });
            wash(c, blob(cx, lt, lw * 0.98, lid * 0.42, 0.2), "170, 172, 186", 8, 0.22, { k: 0.08, rim: "70, 72, 84", rimAlpha: 0.2 });
            c.fillStyle = "rgba(14, 14, 22, 0.75)";
            for (let i = 0; i < 5; i++) {
              c.beginPath();
              c.ellipse(cx + (i - 2) * lw * 0.32, lt + (i % 2 ? 0.8 : -0.6) * S, 1 * S, 0.6 * S, 0, 0, 6.2832);
              c.fill();
            }
            c.strokeStyle = "rgba(246, 210, 160, 0.36)";
            c.lineWidth = 1 * S;
            c.beginPath();
            c.moveTo(m(cx - lw * 0.9), lt + lid * 0.5);
            c.lineTo(m(cx - lw * 0.2), lt + lid * 0.55);
            c.stroke();
          }
        }

        function paintJar(kind, back, W, H, desk, side, px) {
          const frame = S;
          S = Math.max(S, 0.5 * H / 620);
          const g = jarShape(kind, W, H, desk, side);
          const s = surfaces(kind, g, px);
          // Its shadow on the desk, thrown away from the lamp.
          wash(back, blob(g.cx - g.lamp * 0.2 * g.jw, g.base + 2 * S, g.jw * 0.66, 7 * S), "10, 6, 10", 14, 0.06, { k: 0.2 });
          back.save();
          outline(back, g);
          back.clip();
          // Glass tints what is behind it.
          back.fillStyle = "rgba(30, 48, 66, 0.4)";
          back.fillRect(g.L - 2, g.T - 2, g.jw + 4, g.jh + 4);
          (kind === "flower" ? flowerBack : bugBack)(back, g);
          back.restore();
          s.life.save();
          outline(s.life, g);
          s.life.clip();
          (kind === "flower" ? flowerLife : bugLife)(s.life, g, s);
          s.life.restore();
          paper(s.life, s.w, s.h, 0);
          glassFront(s.glass, g, kind);
          S = frame;
          return g.T - g.lid - 2 * S;
        }

        function paintNear(c, W, H) {
          c.clearRect(0, 0, W, H);
          // The desk, seen from above; its far edge meets the window sill at `desk`.
          const desk = 0.86 * H;
          const top = shape([
            { x: -0.05 * W, y: desk, v: 0.04 }, { x: 0.32 * W, y: desk, v: 0.04 }, { x: 0.66 * W, y: desk, v: 0.04 },
            { x: 1.05 * W, y: desk, v: 0.04 }, { x: 1.05 * W, y: 1.3 * H, v: 0.04 }, { x: -0.05 * W, y: 1.3 * H, v: 0.04 },
          ], 0.5 * W, H);
          c.save();
          trace(c, top);
          const g = c.createLinearGradient(0, desk, 0, H);
          g.addColorStop(0, "#30231f");
          g.addColorStop(1, "#1a1216");
          c.fillStyle = g;
          c.fill();
          c.clip();
          wash(c, blob(0.28 * W, desk + 0.1 * H, 0.38 * W, 0.09 * H), "128, 76, 42", 22, 0.035, { spread: 0.1 });
          wash(c, blob(0.86 * W, desk + 0.1 * H, 0.3 * W, 0.1 * H), "26, 18, 20", 20, 0.06, { spread: 0.1 });
          // Grain, dry-brushed: a nearly dry brush dragged across leaves broken strokes,
          // which is what says wood rather than ground.
          c.lineCap = "round";
          for (let i = 0; i < 11; i++) {
            const y = desk + (0.012 + i * 0.013 + gauss() * 0.003) * H;
            for (let x = -10 * S + rand() * 60 * S; x < W; ) {
              const len = (30 + rand() * 140) * S, sag = gauss() * 1.2 * S;
              c.strokeStyle = rand() < 0.75 ? "rgba(16, 10, 10, " + (0.1 + rand() * 0.14) + ")" : "rgba(214, 150, 92, " + (0.05 + rand() * 0.06) + ")";
              c.lineWidth = (0.6 + rand() * 1.2) * S;
              c.beginPath();
              c.moveTo(x, y + gauss() * 0.5 * S);
              c.quadraticCurveTo(x + len / 2, y + sag, x + len, y + gauss() * 0.5 * S);
              c.stroke();
              x += len + (8 + rand() * 50) * S;
            }
          }
          c.restore();
          // The window's own frame at either side, which is what puts the viewer indoors.
          // The lamp, low on the left, catches the inside face of the right-hand jamb.
          for (const [x0, x1] of [[-0.03 * W, 0.028 * W], [0.972 * W, 1.03 * W]]) {
            const jamb = shape([
              { x: x0, y: -0.03 * H, v: 0.03 }, { x: x1, y: -0.03 * H, v: 0.03 }, { x: x1, y: 0.45 * H, v: 0.03 },
              { x: x1, y: desk + 2 * S, v: 0.02 }, { x: x0, y: desk + 2 * S, v: 0.02 },
            ], (x0 + x1) / 2, 0.5 * H);
            trace(c, jamb);
            c.fillStyle = "#1a1316";
            c.fill();
            wash(c, jamb, "52, 34, 28", 8, 0.12, { k: 0.32, rim: "6, 4, 8", rimAlpha: 0.2 });
          }
          const lit = c.createLinearGradient(0, desk, 0, 0.3 * H);
          lit.addColorStop(0, "rgba(236, 176, 112, 0.34)");
          lit.addColorStop(1, "rgba(236, 176, 112, 0)");
          c.strokeStyle = lit;
          c.lineWidth = 1.6 * S;
          c.beginPath();
          c.moveTo(0.972 * W, desk);
          c.lineTo(0.973 * W, 0.3 * H);
          c.stroke();
          // Shadow where the desk meets the wall, and the lamp catching the sill above it.
          for (let i = 0; i < 2; i++) {
            c.save();
            c.translate(gauss() * 2 * S, gauss() * 0.8 * S);
            trace(c, top);
            c.strokeStyle = "rgba(10, 6, 12, " + (0.3 + i * 0.12) + ")";
            c.lineWidth = (1.6 + i * 1.2) * S;
            c.stroke();
            c.restore();
          }
          c.save();
          c.translate(0, -2.4 * S);
          trace(c, top);
          c.strokeStyle = "rgba(236, 190, 130, 0.22)";
          c.lineWidth = 1.1 * S;
          c.stroke();
          c.restore();
          const px = W / near.getBoundingClientRect().width;
          const tops = [paintJar("flower", c, W, H, desk, 1, px), paintJar("bugs", c, W, H, desk, -1, px)];
          paper(c, W, H, Math.max(0, Math.floor(Math.min(...tops, desk - 4 * S))));
        }

        function paintFlash(c, W, H) {
          c.clearRect(0, 0, W, H);
          wash(c, blob(0.5 * W, -0.12 * H, 0.62 * W, 0.56 * H), "196, 190, 255", 26, 0.03, { spread: 0.15 });
          wash(c, blob(0.14 * W, 0.02 * H, 0.24 * W, 0.34 * H), "214, 206, 255", 18, 0.03, { spread: 0.12 });
          wash(c, blob(0.88 * W, 0.04 * H, 0.24 * W, 0.32 * H), "214, 206, 255", 18, 0.03, { spread: 0.12 });
        }

        // Rain, as brushwork. Each sheet keeps its CSS dots as the fallback, and its
        // whole-tile drift; only the tile's picture changes, to a few short strokes of pale
        // wash that pool into a bead at the lower end, the way a loaded brush leaves a
        // mark. They lean along the drift, so each falls the way it points. A drop near
        // the tile's edge is drawn again one tile over, so the seam never cuts a stroke.
        // The tile's size is read from the sheet's own background-size, which the drift
        // keyframes are whole multiples of, so the CSS stays the one place it is set.
        const SHEETS = [
          ["rain--far", 4, 5, 1.0, "190, 196, 232", 0.26],
          ["rain--mid", 4, 8, 1.3, "210, 214, 246", 0.3],
          ["rain--near", 3, 11, 1.8, "236, 236, 252", 0.34],
        ];
        function drop(c, x, y, len, wid, rgb, alpha) {
          const ux = 0.257, uy = 0.966, nx = uy, ny = -ux;
          const tx = x - ux * len, ty = y - uy * len, mx = x - ux * len * 0.4, my = y - uy * len * 0.4;
          c.fillStyle = "rgba(" + rgb + ", " + alpha * 0.3 + ")";
          for (let i = 0; i < 3; i++) {
            const w = wid * (0.4 + rand() * 0.25), j = gauss() * 0.3;
            c.beginPath();
            c.moveTo(tx + nx * j, ty + ny * j);
            c.quadraticCurveTo(mx + nx * w, my + ny * w, x + nx * w * 0.8, y + ny * w * 0.8);
            c.lineTo(x - nx * w * 0.8, y - ny * w * 0.8);
            c.quadraticCurveTo(mx - nx * w, my - ny * w, tx + nx * j, ty + ny * j);
            c.fill();
          }
          c.beginPath();
          c.arc(x, y, wid * 0.62, 0, 6.2832);
          c.fillStyle = "rgba(" + rgb + ", " + alpha * 0.45 + ")";
          c.fill();
          c.strokeStyle = "rgba(" + rgb + ", " + alpha * 0.8 + ")";
          c.lineWidth = 0.45;
          c.stroke();
        }
        function paintRain(scale) {
          for (const [name, n, len, wid, rgb, alpha] of SHEETS) {
            const sheet = document.querySelector("." + name);
            const [tw, th] = getComputedStyle(sheet).backgroundSize.split(" ").map(parseFloat);
            const tile = document.createElement("canvas");
            tile.width = Math.round(tw * scale);
            tile.height = Math.round(th * scale);
            const c = tile.getContext("2d");
            c.scale(tile.width / tw, tile.height / th);
            for (let i = 0; i < n; i++) {
              // One drop to each band down the tile, so no two crowd together.
              const x = rand() * tw, y = ((i + 0.2 + rand() * 0.6) / n) * th, l = len * (0.8 + rand() * 0.4);
              for (const ox of [-tw, 0, tw]) for (const oy of [-th, 0, th]) drop(c, x + ox, y + oy, l, wid, rgb, alpha);
            }
            sheet.style.backgroundImage = "url(" + tile.toDataURL() + ")";
          }
        }

        // Lightning, as a watercolourist paints it: the bolt was masked out before the sky
        // went in, so it is bare paper, cream, with the sky's pigment pooled dark along its
        // edges where the mask lifted, and the flash round it is a bleed of lavender wash,
        // blooming where each branch starts. A masked line is never ruler-smooth, so every
        // pass wanders a little, and the thin branches break where the mask was thin.
        let branches;
        function paintBolts(scale) {
          branches = branches || [...document.querySelectorAll("#lb path")].map((path) => {
            const n = path.getAttribute("d").match(/[\d.]+/g).map(Number), pts = [];
            let len = 0;
            for (let i = 0; i < n.length; i += 2) {
              pts.push({ x: n[i], y: n[i + 1] });
              if (i) len += Math.hypot(n[i] - n[i - 2], n[i + 1] - n[i - 1]);
            }
            return { pts, w: 0.45 + Math.min(1, len / 320) };
          });
          const M = 24, VW = 200 + 2 * M, VH = 400 + 2 * M;
          document.querySelectorAll(".bolt").forEach((canvas, n) => {
            // Set the aspect first, so the CSS height decides the width, then measure.
            canvas.width = VW;
            canvas.height = VH;
            const k = (canvas.getBoundingClientRect().height / VH) * scale;
            canvas.width = Math.round(VW * k);
            canvas.height = Math.round(VH * k);
            const c = canvas.getContext("2d");
            c.setTransform(k, 0, 0, k, M * k, M * k);
            c.lineCap = c.lineJoin = "round";
            reseed(29 + n);
            function pass(rgb, alpha, width, jitter, broken) {
              c.strokeStyle = "rgba(" + rgb + ", " + alpha + ")";
              for (const b of branches) {
                c.lineWidth = width * b.w * (0.85 + rand() * 0.3);
                c.setLineDash(broken && b.w < 0.9 ? [4 + rand() * 30, 1 + rand() * 3] : []);
                c.beginPath();
                b.pts.forEach((p, i) => c[i ? "lineTo" : "moveTo"](p.x + gauss() * jitter, p.y + gauss() * jitter));
                c.stroke();
              }
            }
            for (let i = 0; i < 6; i++) pass("150, 122, 236", 0.045, 14 + i * 3.5, 2.6);
            for (const b of branches) {
              wash(c, blob(b.pts[0].x, b.pts[0].y, 9 * b.w, 9 * b.w), "176, 156, 250", 5, 0.03, { spread: 0.2 });
            }
            pass("22, 16, 60", 0.5, 3.4, 0.35);
            pass("255, 248, 234", 0.8, 1.7, 0.3, true);
            pass("255, 250, 240", 0.55, 0.9, 0.5);
          });
        }

        function fit(canvas, scale) {
          const box = canvas.getBoundingClientRect();
          canvas.width = Math.max(1, Math.round(box.width * scale));
          canvas.height = Math.max(1, Math.round(box.height * scale));
          S = Math.min(canvas.width / 960, canvas.height / 620);
          return [canvas.getContext("2d"), canvas.width, canvas.height];
        }
        function paintAll() {
          // Once the visitor clicks through, the poster is detached; leave it be.
          if (!sky.isConnected) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          reseed(7);
          paintSky(...fit(sky, dpr));
          reseed(11);
          paintNear(...fit(near, dpr));
          // The flash is nothing but soft wash, so half resolution loses nothing.
          reseed(13);
          paintFlash(...fit(flash, dpr / 2));
          reseed(17);
          paintRain(dpr);
          paintBolts(dpr);
        }
        let again = 0;
        window.addEventListener("resize", () => {
          clearTimeout(again);
          again = setTimeout(paintAll, 150);
        });
        paintAll();
      })();

      // Swap the poster for the real app only once the visitor asks for it. Same-origin,
      // so the sandbox keeps normal access to localStorage and can save scenes.
      // The whole card is clickable for convenience, while the real <button> inside it is
      // the keyboard and screen-reader target.
      function enter() {
          const poster = document.getElementById("poster");
          const frame = document.createElement("iframe");
          frame.src = "index.html";
          frame.title = "Night Desk Terrarium";
          frame.allow = "autoplay; fullscreen";
          // If the app never arrives — a deploy mid-flight, a dropped connection — put the
          // poster back rather than leaving a dead frame the visitor cannot retry from.
          const giveUp = setTimeout(() => {
            document.body.replaceChildren(poster);
            // The frame may have changed size while the poster was away, and the jars'
            // layers are placed in pixels, so repaint it to fit.
            window.dispatchEvent(new Event("resize"));
            document.getElementById("hint").textContent = "That did not load — click to try again";
            document.getElementById("poster").addEventListener("click", enter, { once: true });
          }, 20000);
          frame.addEventListener("load", () => clearTimeout(giveUp), { once: true });
          document.body.replaceChildren(frame);
          frame.focus();
      }
      document.getElementById("poster").addEventListener("click", enter, { once: true });
    </script>
  </body>
</html>
